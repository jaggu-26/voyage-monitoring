<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel 360 — Nova Horizon II</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Medium.woff2') format('woff2');font-weight:500;font-display:swap;}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
    *{font-family:'Gilroy',-apple-system,system-ui,sans-serif;box-sizing:border-box;}
    html,body{height:100%;margin:0;overflow:hidden;}
    body{display:flex;background:#fff;}
    #root{flex:1;overflow:hidden;min-width:0;}

    /* ── NAV RAIL ── */
    :root {
      --sidebar-width:220px; --sidebar-width-collapsed:52px;
      --color-sidebar:#ffffff; --color-sidebar-hover:#F7FAFC;
      --color-sidebar-active:#EEF6FF; --color-sidebar-text:#64748b;
      --color-sidebar-text-active:#1852FE; --color-border-nav:#e4e9f2;
      --color-surface-subtle:#f1f5f9; --color-text-default:#0E1A33;
      --color-text-secondary:#5a6b85; --color-text-placeholder:#94a3b8;
      --radius-sm:4px; --radius-full:9999px; --prim-marine:#001E4C;
      --prim-font-primary:'Gilroy',-apple-system,system-ui,sans-serif;
      --prim-font-weight-semibold:600;
    }
    .nav-rail{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--color-sidebar);display:flex;flex-direction:column;height:100vh;flex-shrink:0;overflow:hidden;transition:width 220ms ease;border-right:1px solid var(--color-border-nav);contain:layout style paint;}
    .nav-rail.collapsed{min-width:var(--sidebar-width-collapsed);}
    .nav-rail.collapsed{width:var(--sidebar-width-collapsed);}
    .sidebar-logo{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--color-border-nav);overflow:hidden;}
    .sidebar-logo-icon{width:22px;height:22px;flex-shrink:0;}
    .sidebar-logo-text{flex:1;overflow:hidden;white-space:nowrap;}
    .nav-rail.collapsed .sidebar-logo-text{opacity:0;width:0;pointer-events:none;}
    .sidebar-logo-name{font-size:14px;font-weight:600;color:var(--color-text-default);letter-spacing:-0.2px;}
    .sidebar-logo-sub{font-size:10px;color:var(--color-text-placeholder);}
    .nav-collapse-btn{border:none;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);border-radius:var(--radius-sm);padding:4px;transition:background 120ms ease,color 120ms ease;}
    .nav-collapse-btn:hover{background:var(--color-surface-subtle);color:var(--color-text-default);}
    .collapse-chevron{width:15px;height:15px;display:block;}
    .collapse-hamburger{width:18px;height:18px;display:none;}
    .nav-rail.collapsed .collapse-chevron{display:none;}
    .nav-rail.collapsed .collapse-hamburger{display:block;}
    .nav-rail.collapsed .sidebar-logo{padding:16px 0;justify-content:center;gap:0;}
    .nav-rail.collapsed .sidebar-logo-text{flex:0 0 0;width:0;}
    .nav-rail.collapsed .sidebar-logo-icon{display:none;}
    .nav-rail.collapsed .sidebar-logo .nav-collapse-btn{width:24px;height:24px;border-radius:4px;padding:3px;}
    .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none;}
    .sidebar-nav::-webkit-scrollbar{display:none;}
    .nav-rail.collapsed .sidebar-nav{overflow:visible;display:flex;flex-direction:column;justify-content:flex-start;}
    .nav-section{display:flex;flex-direction:column;gap:4px;padding:0 8px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;font-size:13.5px;font-family:var(--prim-font-primary);color:var(--color-sidebar-text);cursor:pointer;transition:background 120ms ease,color 120ms ease;position:relative;user-select:none;text-decoration:none;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;border-radius:8px;}
    .nav-item:hover{background:var(--color-sidebar-hover);color:var(--color-text-default);}
    .nav-item.active{background:var(--color-sidebar-active);color:var(--color-sidebar-text-active);border-left-color:transparent;border-radius:8px;}
    .nav-item svg{width:20px;height:20px;flex-shrink:0;}
    .nav-item-label{flex:1;overflow:hidden;transition:opacity 150ms ease;}
    .nav-rail.collapsed .nav-section{padding:16px 0 0;gap:14px;align-items:center;}
    .nav-rail.collapsed .nav-item{height:32px;width:32px;justify-content:center;align-items:center;padding:0;gap:0;border-left:none!important;border-radius:4px;background:transparent;}
    .nav-rail.collapsed .nav-item:hover{background:var(--color-sidebar-hover);}
    .nav-rail.collapsed .nav-item.active{background:#eef6ff;}
    .nav-rail.collapsed .nav-item svg{width:19px;height:19px;}
    .nav-rail.collapsed .nav-item-label{opacity:0;flex:0 0 0;width:0;overflow:hidden;}
    .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid var(--color-border-nav);}
    .sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;overflow:hidden;white-space:nowrap;transition:background 120ms ease;}
    .sidebar-user:hover{background:var(--color-sidebar-hover);}
    .nav-rail.collapsed .sidebar-user{justify-content:center;padding:10px;gap:0;}
    .nav-avatar{width:28px;height:28px;border-radius:var(--radius-full);background:#001E4C;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;}
    .sidebar-user-info{flex:1;overflow:hidden;transition:opacity 150ms ease;}
    .nav-rail.collapsed .sidebar-user-info{opacity:0;flex:0 0 0;width:0;}
    .sidebar-user-name{font-size:13px;font-weight:600;color:var(--color-text-default);}
    .sidebar-user-role{font-size:11px;color:var(--color-text-placeholder);margin-top:1px;}
    .scroll{overflow-y:auto;}
    .scroll::-webkit-scrollbar{width:4px;height:4px;}
    .scroll::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:99px;}
    .scroll::-webkit-scrollbar-track{background:transparent;}

    /* Map animations */
    @keyframes vessel-pulse{0%{r:5;opacity:0.6}100%{r:14;opacity:0}}
    @keyframes live-blink{0%,100%{opacity:1}50%{opacity:0.3}}
    @keyframes dash-move{to{stroke-dashoffset:-20}}
    @keyframes pop-slide-in{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes vessel-ripple{0%{transform:scale(1);opacity:0.3}100%{transform:scale(2.2);opacity:0}}
    .vessel-ripple-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,0.35);animation:vessel-ripple 4s ease-out infinite;pointer-events:none;}

    /* ── Advanced vessel hero transition animations ── */

    /* Radial blue ripple emanating from card position (top-left content area) */
    @keyframes card-sweep{
      0%  {clip-path:circle(0% at 22% 48%);opacity:0.85;}
      55% {clip-path:circle(110% at 22% 48%);opacity:0.45;}
      100%{clip-path:circle(110% at 22% 48%);opacity:0;}
    }

    /* Full hero row — rises from card depth with blur dissolve */
    @keyframes vh-outer{
      0%  {opacity:0;transform:translateY(90px) scale(1.28);filter:blur(18px);}
      22% {opacity:0.5;filter:blur(7px);}
      60% {opacity:1;transform:translateY(-5px) scale(1.01);filter:blur(1px);}
      78% {transform:translateY(2px) scale(0.999);}
      90% {transform:translateY(-1px);}
      100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }

    /* Icon — pops from card with spring overshoot */
    @keyframes vh-icon{
      0%  {opacity:0;transform:scale(0.18) rotate(-22deg);filter:blur(8px);}
      35% {opacity:1;filter:blur(0);transform:scale(1.28) rotate(7deg);}
      55% {transform:scale(0.88) rotate(-3deg);}
      72% {transform:scale(1.07) rotate(2deg);}
      85% {transform:scale(0.97) rotate(0deg);}
      100%{opacity:1;transform:scale(1) rotate(0deg);filter:blur(0);}
    }

    /* Name — shrinks from card-hero font with blur */
    @keyframes vh-name{
      0%  {opacity:0;transform:translateY(22px) scale(1.65);filter:blur(10px);}
      28% {opacity:0.7;filter:blur(4px);}
      62% {transform:translateY(-4px) scale(1.01);filter:blur(0);}
      78% {transform:translateY(2px) scale(0.999);}
      100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }

    /* ID subtitle — floats up after name settles */
    @keyframes vh-id{
      0%  {opacity:0;transform:translateY(14px);filter:blur(6px);}
      55% {filter:blur(0);}
      100%{opacity:1;transform:translateY(0);filter:blur(0);}
    }

    /* Back arrow — sweeps in from left */
    @keyframes vh-back{
      0%  {opacity:0;transform:translateX(-22px) scale(0.75);}
      55% {transform:translateX(2px) scale(1.04);}
      100%{opacity:1;transform:translateX(0) scale(1);}
    }

    /* Content panel — rises and sharpens */
    @keyframes panel-slide-in{
      0%  {opacity:0;transform:translateY(44px) scale(0.96);filter:blur(12px);}
      35% {filter:blur(4px);}
      68% {transform:translateY(-4px) scale(1.004);filter:blur(0);}
      82% {transform:translateY(2px);}
      100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }

    @keyframes orb-status-pulse{
      0%,100%{opacity:0.6;transform:scale(1);}
      50%{opacity:1;transform:scale(1.15);}
    }
    .orb-status-dot{animation:orb-status-pulse 2s ease-in-out infinite;}

    /* Respect reduced-motion preference */
    @media(prefers-reduced-motion:reduce){
      *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;}
    }
    .vessel-ring{animation:vessel-pulse 2s ease-out infinite;}
    .live-dot{animation:live-blink 2s infinite;}
    .route-dash{animation:dash-move 1.4s linear infinite;}

    /* Stacked card */
    .stk{position:relative;padding-bottom:9px;}
    .stk::before{content:'';position:absolute;top:5px;left:7px;right:7px;bottom:3px;background:#e8edff;border:1px solid #c7d4fd;border-radius:14px;z-index:0;}
    .stk::after{content:'';position:absolute;top:10px;left:13px;right:13px;bottom:0;background:#d3dcfe;border:1px solid #b5c6fc;border-radius:14px;z-index:-1;}
    .stk-front{position:relative;z-index:1;background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:13px;}

    /* Port timeline row */
    .port-col{flex:1;cursor:pointer;transition:background 120ms;}
    .port-col:hover{background:rgba(24,82,254,0.04);}

    /* Passage port cell — hover & active */
    .passage-port-cell {
      cursor: pointer;
      transition: background 140ms ease, box-shadow 140ms ease;
      border-radius: 0;
    }
    .passage-port-cell:hover {
      background: rgba(24,82,254,0.055) !important;
    }
    .passage-port-cell:active {
      background: rgba(24,82,254,0.11) !important;
      transition-duration: 60ms;
    }

    /* Vessel icon button on the progress bar */
    .passage-vessel-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      border-radius: 50%;
      transition: filter 150ms ease, transform 150ms ease;
      position: absolute;
      right: -22px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
    }
    .passage-vessel-btn:hover {
      filter: drop-shadow(0 0 6px rgba(24,82,254,0.45)) brightness(1.06);
      transform: translateY(-50%) scale(1.1);
    }
    .passage-vessel-btn:active {
      filter: drop-shadow(0 0 3px rgba(24,82,254,0.6)) brightness(0.96);
      transform: translateY(-50%) scale(1.04);
      transition-duration: 60ms;
    }

    /* Nav arrow buttons beside port strip */
    .passage-nav-btn {
      transition: background 120ms ease, color 120ms ease;
    }
    .passage-nav-btn:hover {
      background: #f0f4f8;
      color: #1852FE;
    }
    .passage-nav-btn:active {
      background: #e6edfd;
      transition-duration: 60ms;
    }
    .paq-row{transition:background 120ms;cursor:pointer;}
    .paq-row:hover{background:#f4f8ff!important;}
    .tab-btn{transition:color 150ms,border-color 150ms;}
    .review-btn:hover{background:#1340d4!important;}
    .email-row{transition:background 120ms;cursor:pointer;}
    .email-row:hover{background:#f8faff!important;}

    /* CII gradient bar */
    .cii-bar{height:7px;border-radius:99px;background:linear-gradient(to right,#22c55e 0%,#86efac 22%,#fbbf24 45%,#f97316 68%,#ef4444 100%);}
    /* ── Drag-and-drop card sorting ──
       Grip lives inside the card (absolute, top-left), hidden until hover.
       The card itself never moves or resizes — only its title row (marked
       with .card-title-row) nudges right on hover to clear space for the
       grip, so nothing ever overlaps and nothing outside the card shifts.
       Top-row cards nest an inner .drag-card (per mini-card) inside an outer
       .drag-card (the whole row) — hovering an inner card also technically
       hovers its outer ancestor, which would otherwise reveal every sibling's
       grip too. :not(:has(...)) restricts the effect to only the innermost
       (most specific) hovered card, so adjacent cards stay untouched. */
    .drag-card{position:relative;border-radius:8px;transition:opacity 200ms ease;}
    .drag-card:hover:not(:has(.drag-card:hover)) > .drag-grip{opacity:1;background:#EEF4FF;border-color:#c7d9ff;}
    .drag-card:hover:not(:has(.drag-card:hover)) .card-title-row{transform:translateX(18px);}
    .drag-grip{position:absolute;top:12px;left:8px;z-index:20;cursor:grab;opacity:0;transition:opacity 150ms,background 150ms;background:rgba(255,255,255,0.95);border:1px solid #e4e9f2;border-radius:4px;padding:4px 3px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.07);overflow:hidden;max-width:calc(100% - 16px);}
    .drag-grip:active{cursor:grabbing;}
    .card-title-row{transition:transform 180ms ease;}
    .drag-card.is-dragging{opacity:0.25;pointer-events:none;}
    /* Vertical drop lines (for the stacked list) */
    .drag-card.dv-before::before{content:'';position:absolute;top:-8px;left:0;right:0;height:3px;background:#1852FE;border-radius:2px;z-index:30;}
    .drag-card.dv-after::after {content:'';position:absolute;bottom:-8px;left:0;right:0;height:3px;background:#1852FE;border-radius:2px;z-index:30;}
    /* Horizontal drop lines (inside the 3-col top row) */
    .drag-card.dh-before::before{content:'';position:absolute;top:0;left:-7px;bottom:0;width:3px;background:#1852FE;border-radius:2px;z-index:30;}
    .drag-card.dh-after::after {content:'';position:absolute;top:0;right:-7px;bottom:0;width:3px;background:#1852FE;border-radius:2px;z-index:30;}

    /* ── Digital Operator task cards (ported from geonix.html for consistency) ── */
    .gx-op-card{
      position:relative;flex-shrink:0;width:270px;box-sizing:border-box;
      display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:8px;
      cursor:pointer;border:1px solid transparent;
    }
    .gx-op-card--active{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#2463eb,rgba(36,99,235,0)) border-box;
    }
    .gx-op-card--active:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#2463eb,rgba(36,99,235,0)) border-box;
    }
    .gx-op-card--pending{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#ca8a03,rgba(202,138,3,0)) border-box;
    }
    .gx-op-card--pending:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#ca8a03,rgba(202,138,3,0)) border-box;
    }
    .gx-op-card--completed{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#1b9e4b,rgba(27,158,75,0)) border-box;
    }
    .gx-op-card--completed:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#1b9e4b,rgba(27,158,75,0)) border-box;
    }
    .gx-op-card--high-alert{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#dc2625,rgba(220,38,37,0)) border-box;
    }
    .gx-op-card--high-alert:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#dc2625,rgba(220,38,37,0)) border-box;
    }
    .gx-op-card.gx-op-card--selected,.gx-op-card.gx-op-card--selected:hover{
      background:linear-gradient(rgba(31,58,138,0.8),rgba(31,58,138,0.8)) padding-box;
      border-color:#5fa5f9;
    }

    /* "In progress" status — pulsing dots read as active AI work, not a static icon */
    .gx-icon-dots .gx-dot {
      transform-box: fill-box; transform-origin: center;
      animation: gx-dot-pulse 1.2s ease-in-out infinite;
    }
    .gx-icon-dots .gx-dot:nth-child(1) { animation-delay: 0ms; }
    .gx-icon-dots .gx-dot:nth-child(2) { animation-delay: 160ms; }
    .gx-icon-dots .gx-dot:nth-child(3) { animation-delay: 320ms; }
    @keyframes gx-dot-pulse {
      0%, 60%, 100% { opacity: 0.35; transform: scale(0.75); }
      30% { opacity: 1; transform: scale(1.15); }
    }
    /* "Pending" status — a slow breathing pulse signals it's waiting, not idle */
    .gx-icon-pending {
      transform-box: fill-box; transform-origin: center;
      animation: gx-pending-breathe 1.8s ease-in-out infinite;
    }
    @keyframes gx-pending-breathe {
      0%, 100% { opacity: 0.55; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gx-icon-dots .gx-dot, .gx-icon-pending { animation: none; }
    }

    /* ── Vessel Intelligence Agent — rich panel styles (ported from geonix.html) ── */
    .gx-qv-chip{height:32px;padding:8px;border-radius:4px;border:1px solid #e2e8f0;background:#fff;color:#1e293b;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:background 120ms,border-color 120ms}
    .gx-qv-chip:hover{background:#eef6ff;border-color:#5fa5f9}
    .gx-qv-chip--active,.gx-qv-chip--active:hover{background:#001E4C;border-color:#001E4C;color:#fff}
    .gx-ri{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:36px;padding:4px 12px;border-bottom:1px dashed #e2e8f0;background:#fff;transition:background 700ms ease}
    .gx-ri:last-child{border-bottom:none}
    .gx-ri:hover{background:#eef6ff;padding:2px 8px 2px 12px}
    .gx-ri:hover .gx-ri-actions{display:flex}
    .gx-ri--error{border-left:3px solid #dc2625}
    .gx-ri--flash{background:#fef1f2!important;transition:background 200ms ease}
    .gx-ri-actions{display:none;align-items:center;gap:4px;flex-shrink:0}
    .gx-ri-actions button{width:24px;height:24px;border:none;background:transparent;cursor:pointer;color:#5a6b85;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0}
    .gx-ri-actions button:hover{background:rgba(0,0,0,0.06)}
    .gx-ri--excluded .gx-ri-label,.gx-ri--excluded .gx-ri-value{opacity:0.4;text-decoration:line-through}
    .gx-accordion-header{background:#fff;display:flex;align-items:center;gap:16px;padding:8px 12px;width:100%;border:none;cursor:pointer;font-family:inherit;transition:background 120ms}
    .gx-accordion-header:hover{background:#eef6ff}
    .gx-accordion-footer{background:#fff;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:flex-end;padding:12px 16px}
    .gx-accordion-footer button{display:inline-flex;align-items:center;gap:4px;height:32px;padding:4px 12px;border-radius:4px;border:none;background:#fff;color:#334154;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
    .gx-accordion-footer button:hover{background:#f1f5f9}
    .gx-accordion-footer button.gx-excluded-active{color:#1852FE}
    .gx-chip-seek{opacity:0;transition:opacity 150ms;position:absolute;top:0;bottom:12px;margin:auto 0;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5a6b85;z-index:2}
    .gx-chip-seek:hover{background:#f1f5f9;color:#0E1A33}
    .gx-chip-seek--visible{opacity:1}
    .gx-chip-seek--left{left:6px}
    .gx-chip-seek--right{right:6px}
    .gx-card-seek{opacity:0;position:absolute;top:0;bottom:0;margin:auto 0;height:40px;width:32px;border-radius:8px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,0.55);z-index:4;transition:background 150ms,color 150ms,opacity 150ms}
    .gx-card-seek:hover{background:rgba(255,255,255,0.12);color:#fff}
    .gx-card-seek--visible{opacity:1}
    .gx-card-seek--left{left:16px}
    .gx-card-seek--right{right:16px}
    /* Primary CTA button — Figma Design System node 300:206 (radius-sm 4px, icon-text gap 4px, hover/active/disabled states) */
    .gx-btn-primary{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:4px;border:none;background:#1852FE;color:#fff;font-family:inherit;cursor:pointer;transition:background 120ms ease}
    .gx-btn-primary:hover:not(:disabled){background:#1C4ED8}
    .gx-btn-primary:active:not(:disabled){background:#1F3A8A}

    .gx-email-field{border:none;border-bottom:1.5px solid #e2e8f0;transition:border-color 120ms}

    /* metric card hover */
    .metric-card{transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease;}

    /* ═══════════════════════════════════════════════════════════
       QUICK ACTIONS DIAL
       ═══════════════════════════════════════════════════════════ */
    .qp-btn-group {
      position:fixed; right:0; top:50%; transform:translateY(-50%);
      z-index:490; display:flex; flex-direction:column; gap:8px; align-items:flex-end;
    }
    .qp-dial-btn {
      width:52px; height:52px;
      border-radius:14px 0 0 14px;
      background:linear-gradient(170deg,#2f6cff 0%,#1140c9 100%);
      border:none; cursor:pointer; color:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow:-4px 0 18px rgba(24,82,254,0.40);
      padding:0 10px 0 14px;
      transition:padding-right 180ms ease, box-shadow 180ms ease;
      flex-shrink:0;
    }
    .qp-dial-btn:hover { padding-right:16px; box-shadow:-8px 0 28px rgba(24,82,254,0.55); }
    .qp-dial-btn-ico { width:20px; height:20px; flex-shrink:0; display:block; }
    .dial-overlay {
      position:fixed; inset:0; z-index:500;
      overflow:hidden; pointer-events:none;
    }
    .dial-overlay.d-open { pointer-events:all; }
    .dial-backdrop {
      position:absolute; inset:0;
      background:rgba(8,17,34,0.42);
      opacity:0; transition:opacity 400ms ease;
    }
    .dial-overlay.d-open .dial-backdrop { opacity:1; }
    .dial-hdr {
      position:absolute; right:32px; top:28px; z-index:30;
      display:flex; align-items:center; gap:20px;
      opacity:0; transition:opacity 250ms 150ms ease;
      pointer-events:none;
    }
    .dial-overlay.d-open .dial-hdr { opacity:1; pointer-events:all; }
    .dial-hdr-title { font-size:15px; font-weight:600; letter-spacing:0.2px; color:rgba(255,255,255,0.9); font-family:'Gilroy',-apple-system,system-ui,sans-serif; }
    .dial-close-btn {
      width:40px; height:40px; border-radius:50%; border:none;
      background:rgba(255,255,255,0.15); color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background 150ms;
    }
    .dial-close-btn:hover { background:rgba(255,255,255,0.28); }
    .dial-close-btn svg { width:18px; height:18px; }
    .dial-anchor {
      position:absolute; left:100%; top:50%;
    }
    .dial-disc {
      position:absolute; border-radius:50%;
      background:radial-gradient(120% 120% at 80% 50%,#3f78ff 0%,#1f54ef 46%,#123fd0 100%);
      box-shadow:-30px 0 120px rgba(17,64,208,0.45);
      cursor:grab; user-select:none; touch-action:none;
      transform:scale(0); opacity:0.5;
      transition:transform 550ms cubic-bezier(.33,0,.2,1), opacity 300ms ease;
    }
    .dial-disc:active { cursor:grabbing; }
    .dial-overlay.d-open .dial-disc { transform:scale(1); opacity:1; }
    .dial-ring {
      position:absolute; border-radius:50%;
      top:50%; left:50%; transform:translate(-50%,-50%);
      pointer-events:none;
    }
    .dial-ring.r1 { border:1px solid rgba(255,255,255,0.10); }
    .dial-ring.r2 { border:1px solid rgba(255,255,255,0.15); }
    .dial-spokes {
      position:absolute; left:0; top:0;
      opacity:0; transition:opacity 300ms 180ms ease;
    }
    .dial-overlay.d-open .dial-spokes { opacity:1; }
    .dial-icon-btn {
      position:absolute; left:0; top:0;
      width:56px; height:56px; border-radius:18px;
      border:1px solid rgba(255,255,255,0.25);
      background:rgba(255,255,255,0.10); color:#fff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      margin-left:-28px; margin-top:-28px;
      will-change:transform; z-index:20;
      transition:background 200ms, border-color 200ms, color 200ms, box-shadow 200ms;
    }
    .dial-icon-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; }
    .dial-icon-btn.d-active {
      background:#fff; border-color:#fff; color:#1852fe;
      box-shadow:0 8px 32px rgba(17,64,208,0.50);
    }
    .dial-label {
      position:absolute; left:0; top:0; z-index:10;
      width:320px; text-align:right;
      margin-left:-320px;
      will-change:transform; pointer-events:none;
    }
    .dial-label-inner { transform:translateY(-50%); }
    .dial-label-title {
      font-size:16px; font-weight:800; line-height:1.2; letter-spacing:-0.3px;
      color:rgba(255,255,255,0.55); font-family:'Gilroy',-apple-system,system-ui,sans-serif;
      transition:font-size 300ms ease, color 300ms ease;
    }
    .dial-label.d-active .dial-label-title { font-size:26px; color:#fff; }
    .dial-label-desc {
      margin-top:10px; font-size:13.5px; line-height:1.6;
      color:rgba(255,255,255,0.80); max-width:270px; margin-left:auto;
      font-family:'Gilroy',-apple-system,system-ui,sans-serif;
      max-height:0; overflow:hidden; opacity:0;
      transition:max-height 280ms ease, opacity 250ms ease;
    }
    .dial-label.d-active .dial-label-desc { max-height:80px; opacity:1; }
    @media (max-width: 1140px) {
      /* Clamp label width so left edge stays inside the disc circle at all angles */
      .dial-label { width: 148px; margin-left: -148px; }
      .dial-label-title { font-size: 13px; }
      .dial-label.d-active .dial-label-title { font-size: 18px; }
      .dial-label-desc { font-size: 11.5px; max-width: 136px; }
      .dial-icon-btn { width: 48px; height: 48px; margin-left: -24px; margin-top: -24px; }
      .dial-icon-btn svg { width: 19px; height: 19px; }
    }

      overflow:hidden;

    #ckWorkspace.ck-open { transform:translateX(0); }
    .ck-hdr { flex-shrink:0; background:rgba(0,0,0,0.18); padding:16px 20px 0; border-radius:24px 0 0 0; }

      position:absolute; right:0; top:50%; transform:translateY(-50%);

      background:transparent; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;

    .ck-search {
      width:100%; box-sizing:border-box;
      height:36px; padding:0 12px 0 33px;

      transition:border-color 150ms,background 150ms;
    }
    .ck-search::placeholder { color:rgba(255,255,255,0.38); }
    .ck-search:focus { border-color:rgba(255,255,255,0.38); background:rgba(0,30,76,0.48); }
    .ck-tabs { display:flex; align-items:center; gap:4px; overflow-x:auto; padding:2px 20px 16px; scrollbar-width:none; }
    .ck-tabs::-webkit-scrollbar { display:none; }
    .ck-tab {
      flex-shrink:0; padding:6px 14px;
      font-family:'Gilroy',-apple-system,system-ui,sans-serif;
      font-size:11.5px; font-weight:600; border:1px solid transparent; cursor:pointer;

      white-space:nowrap; transition:color 160ms,background 160ms,border-color 160ms;

    .ck-tab:hover:not(.ck-tab-active) { color:rgba(255,255,255,0.75); background:rgba(255,255,255,0.08); }

    .ck-tab.ck-tab-active::before,.ck-tab.ck-tab-active::after { display:none; }

      display:inline-flex; align-items:center; justify-content:center;

      background:rgba(255,255,255,0.22); border:none; cursor:pointer;
      padding:0; color:rgba(255,255,255,0.90); margin-left:9px; flex-shrink:0;
      vertical-align:middle; transition:background 150ms; line-height:0;
    }
    .ck-tab-del:hover { background:rgba(255,255,255,0.45); }
    .ck-tab-del svg { width:8px; height:8px; display:block; }
    .ck-tab-label { pointer-events:none; }
    .ck-tab-acts { display:none; align-items:center; gap:5px; pointer-events:none; }

    .ck-tab:hover .ck-tab-acts { display:flex; }
    .ck-tab-act {
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:pointer;
      color:rgba(255,255,255,0.9); flex-shrink:0; pointer-events:all;
      transition:background 150ms;
    }
    .ck-tab-act:hover { background:rgba(255,255,255,0.38); }
    .ck-tab-act svg { width:9px; height:9px; display:block; pointer-events:none; }
    .ck-today-group { margin-bottom:4px; }
    .ck-today-vessel-lbl { font-size:10px; font-weight:700; letter-spacing:0.10em; color:rgba(255,255,255,0.35); text-transform:uppercase; padding:14px 0 6px; }
    .ck-today-group:first-child .ck-today-vessel-lbl { padding-top:4px; }
    .ck-body { flex:1; overflow-y:auto; padding:6px 20px 28px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.14) transparent; }

    .ck-list { position:relative; }
    .ck-item { display:flex; align-items:flex-start; gap:12px; padding:9px 0; cursor:pointer; }
    .ck-indicator { display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:20px; padding-top:1px; }
    .ck-dot { width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform 220ms cubic-bezier(0.34,1.10,0.64,1),opacity 180ms; }
    .ck-dot-done { background:rgba(255,255,255,0.96); }
    .ck-dot-done svg { width:11px; height:11px; color:#1852FE; }
    .ck-dot-pending { width:14px; height:14px; border-radius:50%; background:transparent; border:2px solid rgba(255,255,255,0.28); margin:3px; }

    .ck-text { flex:1; padding-top:2px; font-family:'Gilroy',-apple-system,system-ui,sans-serif; font-size:12px; font-weight:600; line-height:1.52; color:#bedbfe; transition:color 160ms; }
    .ck-item.ck-done .ck-text { color:rgba(255,255,255,0.44); text-decoration:line-through; }
    .ck-empty { text-align:center; padding:48px 20px; font-family:'Gilroy',-apple-system,system-ui,sans-serif; font-size:13px; font-weight:500; color:rgba(255,255,255,0.32); }

// ─── TCE Variance Card ────────────────────────────────────────────────────────
function TCECard() {
  const { data } = useContext(VesselDataContext);
  const tce = data.tce;
  const circ = 2 * Math.PI * 30;
  const pct = Math.min(1, Math.abs(tce.pct) / 100);
  const dashLen = circ * pct;
  const isDown = tce.pct < 0;
  return x`
    <div class="metric-card" onClick=${()=>{ if(_setTceInsight) _setTceInsight(true); }} style=${{flex:1,background:'#fff',border:'1px solid #e4e9f2',borderRadius:13,padding:'14px',display:'flex',flexDirection:'column',gap:10,cursor:'pointer'}}>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span class="card-title-row" style=${{fontSize:10,fontWeight:600,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.06em',display:'inline-block'}}>TCE Variance</span>
        <span style=${{fontSize:10,fontWeight:700,color:isDown?'#ef4444':'#16a34a',background:isDown?'#fef2f2':'#f0fdf4',borderRadius:99,padding:'2px 8px'}}>${isDown?'▼':'▲'} ${Math.abs(tce.pct).toFixed(2)}%</span>
      </div>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <div style=${{position:'relative',width:70,height:70,flexShrink:0}}>
          <svg width="70" height="70" viewBox="0 0 70 70">
            <circle cx="35" cy="35" r="30" fill="none" stroke="#f1f5f9" stroke-width="6"/>
            <circle cx="35" cy="35" r="30" fill="none" stroke=${isDown?'#ef4444':'#16a34a'} stroke-width="6"
              stroke-dasharray="${dashLen} ${circ}" stroke-linecap="round"
              transform="rotate(-90 35 35)"/>
            <text x="35" y="32" text-anchor="middle" font-size="11" fill="#0E1A33" font-weight="700" font-family="system-ui">$</text>
            <text x="35" y="43" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-family="system-ui">${Math.round(tce.actual/1000)}K</text>
          </svg>
        </div>
        <div style=${{flex:1}}>
          <div style=${{marginBottom:6}}>
            <div style=${{fontSize:10,color:'#94a3b8',marginBottom:1}}>Actual</div>
            <div style=${{fontSize:20,fontWeight:700,color:'#0E1A33',lineHeight:1}}>$${tce.actual.toLocaleString()}</div>
          </div>
          <div style=${{height:1,background:'#f1f5f9',margin:'6px 0'}}/>
          <div>

            <div style=${{fontSize:14,fontWeight:600,color:'#64748b'}}>$${tce.estimated.toLocaleString()}</div>
          </div>
        </div>
      </div>
    </div>`;
}

const GRIP_SVG = x`<svg width="10" height="12" viewBox="0 0 10 12" fill="#94a3b8" aria-hidden="true"><circle cx="2.5" cy="2.5" r="1.2"/><circle cx="7.5" cy="2.5" r="1.2"/><circle cx="2.5" cy="6" r="1.2"/><circle cx="7.5" cy="6" r="1.2"/><circle cx="2.5" cy="9.5" r="1.2"/><circle cx="7.5" cy="9.5" r="1.2"/></svg>`;

// Pointer-event drag sort — works everywhere, smooth ghost follows cursor
function usePointerSort(initial, horizontal) {
  const [order, setOrder] = useState(initial);
  const orderRef = useRef(initial);
  const [dragId, setDragId] = useState(null);
  const [dropBefore, setDropBefore] = useState(null); // card id to insert before, or '__end__'
  const cardRefs = useRef({});
  const dropRef = useRef(null);

  useEffect(() => { orderRef.current = order; }, [order]);

  // Re-sync when the available card set changes (e.g. switching vessels) —
  // drop ids no longer present, and re-insert any newly-reappeared ones at the
  // position their neighbours occupy in `initial`, not just tacked on the end
  // (otherwise a card that comes back — e.g. flipping vessels — jumps to the
  // bottom of the list instead of returning to its natural spot).
  useEffect(() => {
    setOrder(prev => {
      const initialSet = new Set(initial);
      const prevSet = new Set(prev);
      const kept = prev.filter(id => initialSet.has(id));
      const missing = initial.filter(id => !prevSet.has(id));
      if (!missing.length) return kept;
      const result = kept.slice();
      missing.forEach(id => {
        const idxInInitial = initial.indexOf(id);
        let insertAt = result.length;
        for (let i = 0; i < result.length; i++) {
          if (initial.indexOf(result[i]) > idxInInitial) { insertAt = i; break; }
        }
        result.splice(insertAt, 0, id);
      });
      return result;
    });
  }, [initial.join(',')]);

  const getRef = id => el => { if (el) cardRefs.current[id] = el; };

  function onGripDown(e, id) {
    e.preventDefault();
    e.stopPropagation(); // prevent outer list from also handling
    const cardEl = cardRefs.current[id];
    if (!cardEl) return;
    const r = cardEl.getBoundingClientRect();

    // Create a floating ghost that follows the cursor
    const ghost = cardEl.cloneNode(true);
    Object.assign(ghost.style, {
      position: 'fixed', top: r.top + 'px', left: r.left + 'px',
      width: r.width + 'px', height: r.height + 'px',
      opacity: '0.9', zIndex: '9999', pointerEvents: 'none',
      boxShadow: '0 16px 48px rgba(0,0,0,0.18), 0 2px 10px rgba(24,82,254,0.1)',
      borderRadius: '8px', transition: 'none', margin: '0',
    });
    document.body.appendChild(ghost);

    const offY = e.clientY - r.top;
    const offX = e.clientX - r.left;
    setDragId(id);

    function calcDrop(cx, cy) {
      for (const cid of orderRef.current) {
        if (cid === id) continue;
        const el = cardRefs.current[cid];
        if (!el) continue;
        const er = el.getBoundingClientRect();
        const cursor = horizontal ? cx : cy;
        const mid    = horizontal ? er.left + er.width / 2 : er.top + er.height / 2;
        if (cursor < mid) return cid;
      }
      return '__end__';
    }

    function onMove(e) {
      ghost.style.top  = (e.clientY - offY) + 'px';
      if (horizontal) ghost.style.left = (e.clientX - offX) + 'px';
      const db = calcDrop(e.clientX, e.clientY);
      dropRef.current = db;
      setDropBefore(db);
    }

    function onUp() {
      ghost.remove();
      const db = dropRef.current;
      setOrder(prev => {
        const arr = [...prev];
        arr.splice(arr.indexOf(id), 1);
        if (!db || db === '__end__') arr.push(id);
        else arr.splice(arr.indexOf(db), 0, id);
        orderRef.current = arr;
        return arr;
      });
      dropRef.current = null;
      setDragId(null);
      setDropBefore(null);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  return { order, dragId, dropBefore, getRef, onGripDown };
}

// Vertical sortable list — mousedown on grip to drag
function SortableCardList({ cards, renderCard, gripClass }) {
  const { order, dragId, dropBefore, getRef, onGripDown } = usePointerSort(cards, false);
  const lastId = order[order.length - 1];
  return x`
    <div style=${{display:'flex',flexDirection:'column',gap:14}}>
      ${order.map(id => {
        const cls = 'drag-card'
          + (dragId === id ? ' is-dragging' : '')
          + (dropBefore === id ? ' dv-before' : '')
          + (dropBefore === '__end__' && id === lastId ? ' dv-after' : '');
        return x`
          <div key=${id} ref=${getRef(id)} class=${cls}>
            <div class=${'drag-grip' + (gripClass ? ' '+gripClass : '')} title="Drag to reorder"
              onMouseDown=${e => onGripDown(e, id)}>
              ${GRIP_SVG}
            </div>
            <div class="drag-card-content">${renderCard(id)}</div>
          </div>`;
      })}
    </div>`;
}

// Horizontal sortable row for the top-3 cards — drag left/right within row
function HorizontalSortableCards({ cards, renderCard }) {
  const { order, dragId, dropBefore, getRef, onGripDown } = usePointerSort(cards, true);
  return x`
    <div style=${{display:'grid',gridTemplateColumns:`repeat(${cards.length},1fr)`,gap:12,alignItems:'stretch'}}>
      ${order.map(id => {
        const cls = 'drag-card'
          + (dragId === id ? ' is-dragging' : '')
          + (dropBefore === id ? ' dh-before' : '');
        return x`
          <div key=${id} ref=${getRef(id)} class=${cls} style=${{display:'flex',flexDirection:'column'}}>
            <div class="drag-grip" title="Drag to reorder"
              onMouseDown=${e => onGripDown(e, id)}>
              ${GRIP_SVG}
            </div>
            <div class="drag-card-content" style=${{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>${renderCard(id)}</div>
          </div>`;
      })}
    </div>`;
}

function renderTopCard(id) {
  if (id === 'tce')         return x`<${TCECard}/>`;
  if (id === 'speed')       return x`<${SpeedCard}/>`;
  if (id === 'consumption') return x`<${ConsumptionCard}/>`;
  return null;
}

function renderVitalsRow2(id) {
  if (id === 'weather') return x`<${WeatherCard}/>`;
  if (id === 'uwi')     return x`<${UWICard}/>`;
  return null;
}

const TOP_CARDS_DEFAULT = ['tce','speed','consumption'];
const VITALS_ROW2_DEFAULT = ['weather','uwi'];

// tce-row / vitals-row2 are each a single draggable item in the outer list —
// drag its outer grip to move the whole row together.
// Within a row, drag individual card grips to reorder left/right.
const MAIN_CARDS_DEFAULT = ['tce-row','vitals-row2','noon-report','vetting','cp','cii','ets','contractual','bunker'];

function DocumentsTab() {
  const { vesselName, data } = useContext(VesselDataContext);
  const topCards = TOP_CARDS_DEFAULT.filter(id => (id !== 'speed' || data.speed) && (id !== 'consumption' || data.consumption));
  // STI Popular has no vetting/inspection record on file — drop the card entirely
  // rather than show it empty.
  const mainCards = MAIN_CARDS_DEFAULT.filter(id => id !== 'vetting' || vesselName !== 'STI Popular');

  const renderMainCard = id => {
    if (id === 'tce-row')     return x`<${HorizontalSortableCards} cards=${topCards} renderCard=${renderTopCard}/>`;
    if (id === 'vitals-row2') return x`<${HorizontalSortableCards} cards=${VITALS_ROW2_DEFAULT} renderCard=${renderVitalsRow2}/>`;
    if (id === 'noon-report') return x`<${NoonReportCard}/>`;
    if (id === 'vetting')     return x`<${VettingCard}/>`;
    if (id === 'cp')          return x`<${CPSummaryCard}/>`;
    if (id === 'cii')         return x`<${CIICard}/>`;
    if (id === 'ets')         return x`<div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}><${ETSCard}/><${FuelEUCard}/></div>`;
    if (id === 'contractual') return x`<${ContractualPerformance}/>`;
    if (id === 'bunker')      return x`<${RemainingBunker}/>`;
    return null;
  };

  return x`<${SortableCardList} cards=${mainCards} renderCard=${renderMainCard}/>`;
}

    if (!ddOpen) return;
    const onDoc = e => { if (ddRef.current && !ddRef.current.contains(e.target)) setDdOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);

  const active = guides.find(g => g.name === activeName) || matched;

// Digital Operator card status → card border class + footer icon (ported from geonix.html)
/* ── Status filter dropdown: each option shows a color dot matching the operator card's border color (ported from geonix.html) ── */
/* ── Generic dark-bar dropdown: portal panel so it never gets clipped by an overflow:hidden ancestor ── */
function Dropdown({ value, onChange, options, style, align }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const btnRef = useRef(null);
  const current = options.find(o => o.id === value) || options[0];
  const toggleOpen = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setPos(align==='right'
        ? { top: r.bottom + 6, right: window.innerWidth - r.right, width: r.width }
        : { top: r.bottom + 6, left: r.left, width: r.width });
    }
    setOpen(o => !o);
  };
  return x`
    <div style=${{position:'relative',flexShrink:0}}>
      <button ref=${btnRef} onClick=${toggleOpen} style=${{...style,display:'flex',alignItems:'center',gap:7,position:'relative',textAlign:'left'}}>
        ${current.color ? x`<span style=${{width:8,height:8,borderRadius:'50%',background:current.color,flexShrink:0}}/>` : null}
        <span style=${{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${current.label}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style=${{flexShrink:0}}><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      ${open && pos ? createPortal(x`
        <${Fragment}>
          <div onClick=${()=>setOpen(false)} style=${{position:'fixed',inset:0,zIndex:2998}}/>
          <div style=${{position:'fixed',top:pos.top,left:pos.left,right:pos.right,minWidth:Math.max(170,pos.width),maxHeight:320,overflowY:'auto',zIndex:2999,background:'#fff',borderRadius:10,boxShadow:'0 8px 28px rgba(0,0,0,0.22)',border:'1px solid #e4e9f2'}}>
            ${options.map(opt => {
              const sel = value === opt.id;
              return x`
                <div key=${opt.id} onClick=${()=>{onChange(opt.id);setOpen(false);}}
                  style=${{display:'flex',alignItems:'center',gap:9,padding:'9px 12px',cursor:'pointer',background:sel?'#EEF4FF':'#fff',transition:'background 100ms'}}>
                  ${opt.color ? x`<span style=${{width:8,height:8,borderRadius:'50%',background:opt.color,flexShrink:0}}/>` : null}
                  <span style=${{flex:1,fontSize:13,fontWeight:sel?700:400,color:sel?'#1852FE':'#0E1A33',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${opt.label}</span>
                  ${sel ? x`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1852FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style=${{flexShrink:0}}><polyline points="20 6 9 17 4 12"/></svg>` : null}
                </div>`;
            })}
          </div>
        </${Fragment}>`, document.body) : null}
    </div>`;
}

/* ── Hover tooltip rendered via portal to <body> so it never clips inside a scrolling card ── */
function Tip({ children, variant, bubble }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const show = () => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    setPos({ x: r.left + r.width / 2, y: r.top });
  };
  const hide = () => setPos(null);
  return x`
    <span ref=${ref} class="gx-tt" onMouseEnter=${show} onMouseLeave=${hide}>
      ${children}
      ${pos ? createPortal(x`
        <div class=${'gx-tt-portal '+variant} style=${{position:'fixed',left:pos.x+'px',top:pos.y+'px',transform:'translate(-50%, calc(-100% - 9px))'}}>
          ${bubble}
        </div>`, document.body) : null}
    </span>`;
}

function Toast({ title, message, onDone }) {
  const [visible, setVisible] = useState(false);
  const holdTimer = useRef(null);
  const exitTimer = useRef(null);

  useEffect(() => {
    const enterTimer = setTimeout(() => setVisible(true), 20);
    holdTimer.current = setTimeout(dismiss, GX_TOAST_ENTER_MS + GX_TOAST_HOLD_MS);
    return () => {
      clearTimeout(enterTimer);
      clearTimeout(holdTimer.current);
      clearTimeout(exitTimer.current);
    };
  }, []);

  const dismiss = () => {
    setVisible(false);
    clearTimeout(holdTimer.current);
    exitTimer.current = setTimeout(onDone, GX_TOAST_EXIT_MS);
  };

  return x`
    <div onClick=${dismiss} title="Click to dismiss" style=${{position:'fixed',top:48,left:'50%',
        transform:visible?'translate(-50%,0)':'translate(-50%,-140%)',
        transition:`transform ${visible?GX_TOAST_ENTER_MS:GX_TOAST_EXIT_MS}ms cubic-bezier(.22,1,.36,1)`,
        zIndex:3000,display:'flex',gap:16,alignItems:'center',padding:16,width:400,
        background:'#E9F9EF',border:'0.5px solid #A7E8BF',borderRadius:8,boxShadow:'0 2px 8px rgba(0,0,0,0.2)',cursor:'pointer'}}>

      <div style=${{display:'flex',flexDirection:'column',gap:4}}>

        <div style=${{fontSize:14,lineHeight:'20px',fontWeight:400,color:'#147638'}}>${message}</div>
      </div>
    </div>`;
}

/* ── Vessel Intelligence Reasoning panel body (Quick View accordion) — slots inside vessel360's own REASONING panel shell ── */
function VIReasoningBody({ agent, expanded, onDraftChange, onScrollChange }) {
  const readOnly = agent.status === 'completed';
  const sections = agent.quickView || QUICK_VIEW_SECTIONS;
  const [open, setOpen] = useState(() => new Set(sections.map(s => s.key)));
  const [excludedSections, setExcludedSections] = useState(() => new Set());
  const [itemState, setItemState] = useState({});
  const [flashKey, setFlashKey] = useState(null);
  const [editModal, setEditModal] = useState(null);
  const [scrolledRaw, setScrolledRaw] = useState(false);
  const scrolled = scrolledRaw;
  const setScrolled = v => { setScrolledRaw(v); onScrollChange && onScrollChange(v); };
  const chipScrollRef = useRef(null);
  const [chipFade, setChipFade] = useState({ left:false, right:false });
  const [chipHover, setChipHover] = useState(false);
  const [summaryTab, setSummaryTab] = useState(() => agent.summaryTabs ? agent.summaryTabs[0] : null);
  const [hideOtherQuickAccess, setHideOtherQuickAccess] = useState(false);
  const otherQuickAccessTimer = useRef(null);
  useEffect(() => () => { if (otherQuickAccessTimer.current) clearTimeout(otherQuickAccessTimer.current); }, []);
  const handleOtherSummaryScroll = (e) => {
    setScrolled(e.target.scrollTop > 2);
    setHideOtherQuickAccess(true);
    if (otherQuickAccessTimer.current) clearTimeout(otherQuickAccessTimer.current);
    otherQuickAccessTimer.current = setTimeout(() => setHideOtherQuickAccess(false), 150);
  };

  useEffect(() => {
    setOpen(new Set(sections.map(s => s.key)));
    setExcludedSections(new Set());
    setItemState({});
    setFlashKey(null);
    setEditModal(null);
    setSummaryTab(agent.summaryTabs ? agent.summaryTabs[0] : null);
  }, [agent.id]);

  const checkChipFade = () => {
    const el = chipScrollRef.current;
    if (!el) return;
    const scrollable = el.scrollWidth > el.clientWidth + 1;
    setChipFade({
      left: scrollable && el.scrollLeft > 2,
      right: scrollable && el.scrollLeft < el.scrollWidth - el.clientWidth - 2,
    });
  };
  useEffect(() => {
    checkChipFade();
    window.addEventListener('resize', checkChipFade);
    return () => window.removeEventListener('resize', checkChipFade);
  }, []);
  const seekChips = dir => {
    const el = chipScrollRef.current;
    if (el) el.scrollBy({ left: dir*160, behavior:'smooth' });
  };

  const scrollToSection = key => {
    const el = document.getElementById('gx-qv-section-'+key);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };

  const operatorItems = agent.operatorSummaryItems || [];
  const otherSections = agent.otherSummarySections || [];
  const itemKeyOf = (sectionKey,index) => sectionKey+':'+index;
  const isItemCleared = (sectionKey,index) => !!itemState[itemKeyOf(sectionKey,index)]?.cleared;
  const flaggedCount = sections.reduce((n,s) => n + s.items.filter((it,i)=>it.error && !isItemCleared(s.key,i)).length, 0);
  const operatorFlaggedCount = operatorItems.filter((it,i)=>it.error && !isItemCleared('operatorSummary',i)).length;
  const isValidValue = v => { const t = (v||'').trim(); return !!t && t !== '--'; };

  const toggleSection = key => setOpen(prev => {
    const next = new Set(prev);
    next.has(key) ? next.delete(key) : next.add(key);
    return next;
  });
  const toggleExcludedSection = key => {
    setExcludedSections(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
    onDraftChange && onDraftChange();
  };
  const itemKey = (sectionKey,index) => sectionKey+':'+index;
  const onToggleExclude = (sectionKey,index) => {
    setItemState(prev => {
      const k = itemKey(sectionKey,index);
      const cur = prev[k] || {};
      return {...prev, [k]:{...cur, excluded:!cur.excluded}};
    });
    onDraftChange && onDraftChange();
  };
  const commitEditValue = (sectionKey,index,value,clearError) => {
    setItemState(prev => {
      const k = itemKey(sectionKey,index);
      const cur = prev[k] || {};
      return {...prev, [k]:{...cur, value, cleared: clearError ? true : cur.cleared}};
    });
    onDraftChange && onDraftChange();
  };
  const onOpenEdit = (sectionKey,index) => {
    const item = sectionKey === 'operatorSummary' ? operatorItems[index] : sections.find(s => s.key === sectionKey).items[index];
    const cur = itemState[itemKey(sectionKey,index)];

/* ── Vessel Intelligence Actions panel body (editable email draft + Quill) — slots inside vessel360's own ACTIONS panel shell ── */
function VIActionsBody({ agent, expanded, approved, onApprove, onScrollChange }) {
  const ad = agent.actionDraft;
  const isComplete = agent.status === 'completed';
  const [scrolled, setScrolledRaw] = useState(false);
  const setScrolled = v => { setScrolledRaw(v); onScrollChange && onScrollChange(v); };
  const [from, setFrom] = useState(ad.from);
  const [to, setTo] = useState(ad.to);
  const [cc, setCc] = useState(ad.cc);
  const [bcc, setBcc] = useState('');
  const [subject, setSubject] = useState(ad.subject);
  const [showCc, setShowCc] = useState(false);
  const [showBcc, setShowBcc] = useState(false);
  const editorHostRef = useRef(null);
  const quillRef = useRef(null);

  useEffect(() => {
    setFrom(ad.from); setTo(ad.to); setCc(ad.cc); setBcc('');
    setSubject(ad.subject); setShowCc(false); setShowBcc(false);
  }, [agent.id]);

  useEffect(() => {
    if (!editorHostRef.current) return;
    editorHostRef.current.innerHTML = '';
    const editorEl = document.createElement('div');
    editorHostRef.current.appendChild(editorEl);
    const q = new Quill(editorEl, { theme: 'snow', modules: { toolbar: '#gx-ql-toolbar-'+agent.id } });
    if (ad.bodyHtml) { q.clipboard.dangerouslyPasteHTML(ad.bodyHtml); } else { q.setText(ad.body); }
    quillRef.current = q;
    return () => { quillRef.current = null; };
  }, [agent.id]);

  useEffect(() => {
    if (quillRef.current) quillRef.current.enable(!approved);
  }, [approved]);

  const toolbarBtns = [['ql-bold','Bold'],['ql-italic','Italic'],['ql-underline','Underline'],['ql-strike','Strikethrough'],['ql-link','Link'],['ql-blockquote','Quote'],['ql-code-block','Code']];
  const listBtns = [['ordered','Numbered list'],['bullet','Bullet list']];

    : {display:'flex',flexDirection:'column',gap:4,alignItems:'flex-start',width:'100%'};

    ? {width:50,flexShrink:0,fontSize:14,fontWeight:400,color:'#64748b'}

  const ccBtnStyle = {background:'none',border:'none',color:'#1852FE',fontSize:11.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit',flexShrink:0};

  return x`

            ${!showBcc && !approved ? x`<button onClick=${()=>setShowBcc(true)} style=${ccBtnStyle}>Bcc</button>` : null}
          ` : x`
            <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%'}}>
              <span style=${labelStyle}>To</span>
              <div style=${{display:'flex',gap:8}}>
                ${!showCc && !approved ? x`<button onClick=${()=>setShowCc(true)} style=${ccBtnStyle}>Cc</button>` : null}
                ${!showBcc && !approved ? x`<button onClick=${()=>setShowBcc(true)} style=${ccBtnStyle}>Bcc</button>` : null}

          `}
        </div>

// ─── AI Agent Orb ─────────────────────────────────────────────────────────────
function initOrb(canvas) {
  const THREE = window.THREE;
  const W = canvas.clientWidth || 420;
  const H = canvas.clientHeight || 228;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(90, W / H, 0.1, 200);
  camera.position.z = 16.0;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const uniforms = {
    uTime: { value: 0.0 },
    uMouse: { value: new THREE.Vector2(0, 0) },
  };

  const vs = `
precision highp float;
uniform float uTime;
varying vec3 vNormal;
varying vec3 vViewPos;
varying float vDisp;
vec4 pm4(vec4 x){return mod(((x*34.)+1.)*x,289.);}
vec4 ti4(vec4 r){return 1.79284291400159-.85373472095314*r;}
vec3 fd3(vec3 t){return t*t*t*(t*(t*6.-15.)+10.);}
float noise(vec3 P){
  vec3 Pi0=floor(P),Pi1=Pi0+1.;
  Pi0=mod(Pi0,289.);Pi1=mod(Pi1,289.);
  vec3 Pf0=fract(P),Pf1=Pf0-1.;
  vec4 ix=vec4(Pi0.x,Pi1.x,Pi0.x,Pi1.x);
  vec4 iy=vec4(Pi0.yy,Pi1.yy);
  vec4 iz0=Pi0.zzzz,iz1=Pi1.zzzz;
  vec4 ixy=pm4(pm4(ix)+iy);
  vec4 ixy0=pm4(ixy+iz0),ixy1=pm4(ixy+iz1);
  vec4 gx0=ixy0/7.,gy0=fract(floor(gx0)/7.)-.5;
  gx0=fract(gx0);vec4 gz0=.5-abs(gx0)-abs(gy0);
  vec4 sz0=step(gz0,vec4(0.));gx0-=sz0*(step(0.,gx0)-.5);gy0-=sz0*(step(0.,gy0)-.5);
  vec4 gx1=ixy1/7.,gy1=fract(floor(gx1)/7.)-.5;
  gx1=fract(gx1);vec4 gz1=.5-abs(gx1)-abs(gy1);
  vec4 sz1=step(gz1,vec4(0.));gx1-=sz1*(step(0.,gx1)-.5);gy1-=sz1*(step(0.,gy1)-.5);
  vec3 g000=vec3(gx0.x,gy0.x,gz0.x),g100=vec3(gx0.y,gy0.y,gz0.y);
  vec3 g010=vec3(gx0.z,gy0.z,gz0.z),g110=vec3(gx0.w,gy0.w,gz0.w);
  vec3 g001=vec3(gx1.x,gy1.x,gz1.x),g101=vec3(gx1.y,gy1.y,gz1.y);
  vec3 g011=vec3(gx1.z,gy1.z,gz1.z),g111=vec3(gx1.w,gy1.w,gz1.w);
  vec4 n0=ti4(vec4(dot(g000,g000),dot(g010,g010),dot(g100,g100),dot(g110,g110)));
  g000*=n0.x;g010*=n0.y;g100*=n0.z;g110*=n0.w;
  vec4 n1=ti4(vec4(dot(g001,g001),dot(g011,g011),dot(g101,g101),dot(g111,g111)));
  g001*=n1.x;g011*=n1.y;g101*=n1.z;g111*=n1.w;
  float n000=dot(g000,Pf0),n100=dot(g100,vec3(Pf1.x,Pf0.yz));
  float n010=dot(g010,vec3(Pf0.x,Pf1.y,Pf0.z)),n110=dot(g110,vec3(Pf1.xy,Pf0.z));
  float n001=dot(g001,vec3(Pf0.xy,Pf1.z)),n101=dot(g101,vec3(Pf1.x,Pf0.y,Pf1.z));
  float n011=dot(g011,vec3(Pf0.x,Pf1.yz)),n111=dot(g111,Pf1);
  vec3 fxyz=fd3(Pf0);
  vec4 nz=mix(vec4(n000,n100,n010,n110),vec4(n001,n101,n011,n111),fxyz.z);
  vec2 nyz=mix(nz.xy,nz.zw,fxyz.y);
  return 2.2*mix(nyz.x,nyz.y,fxyz.x);
}
void main(){
  vNormal=normalize(normalMatrix*normal);
  float d1=noise(position*1.1+uTime*.22);
  float d2=noise(position*2.3+uTime*.15+vec3(5.2,1.3,8.7));
  float d3=noise(position*4.5+uTime*.38+vec3(2.4,7.1,3.3));
  vDisp=d1*.38+d2*.16+d3*.06;
  vec3 np=position+normal*vDisp;
  vViewPos=(modelViewMatrix*vec4(np,1.)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(np,1.);
}`;

  const fs = `
precision highp float;
uniform float uTime;
varying vec3 vNormal;
varying vec3 vViewPos;
varying float vDisp;
vec3 hsl2rgb(vec3 c){
  vec3 r=clamp(abs(mod(c.x*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);
  return c.z+c.y*(r-.5)*(1.-abs(2.*c.z-1.));
}
void main(){
  vec3 V=normalize(-vViewPos);
  float NV=max(dot(vNormal,V),0.);
  float fr=pow(1.-NV,2.2);
  float hue=.62+sin(uTime*.28+vNormal.y*1.8+vNormal.x*.6)*.09+vDisp*.22+fr*.05;
  float sat=.78+fr*.18;
  float lit=.28+NV*.22+fr*.38;
  vec3 col=hsl2rgb(vec3(hue,sat,lit));
  vec3 rim=hsl2rgb(vec3(hue+.12,1.,.9));
  col=mix(col,rim,pow(fr,1.6)*.85);
  col=mix(vec3(.02,.025,.07),col,NV*.55+fr*.48+.18);
  float ao=sin(vNormal.y*7.+uTime*.55+vNormal.x*4.)*.5+.5;
  col+=ao*fr*.1*vec3(.15,.45,1.);
  vec3 L=normalize(vec3(.4,.7,1.));
  float sp=pow(max(dot(vNormal,normalize(L+V)),0.),52.);
  col+=sp*.45*vec3(.65,.8,1.);
  gl_FragColor=vec4(col,mix(.52,.28,fr));
}`;

  const mat = new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, transparent: true });
  const geo = new THREE.SphereGeometry(13.0, 96, 96);
  const sphere = new THREE.Mesh(geo, mat);
  scene.add(sphere);

  // Subtle particle field
  const ptGeo = new THREE.BufferGeometry();
  const ptPos = new Float32Array(160 * 3);
  for (let i = 0; i < 160; i++) {
    ptPos[i*3]   = (Math.random()-0.5)*12;
    ptPos[i*3+1] = (Math.random()-0.5)*8;
    ptPos[i*3+2] = (Math.random()-0.5)*5 - 2;
  }
  ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPos, 3));
  const ptMat = new THREE.PointsMaterial({ color: 0x4477ff, size: 0.018, transparent: true, opacity: 0.18 });
  scene.add(new THREE.Points(ptGeo, ptMat));

  let mx = 0, my = 0;
  const onMove = e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width - 0.5;
    my = (e.clientY - r.top) / r.height - 0.5;
  };
  canvas.addEventListener('mousemove', onMove);

  const clock = new THREE.Clock();
  let animId;
  const mv = new THREE.Vector2();

  (function animate() {
    animId = requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    uniforms.uTime.value = t;
    mv.x += (mx - mv.x) * 0.06;
    mv.y += (-my - mv.y) * 0.06;
    uniforms.uMouse.value.copy(mv);
    sphere.rotation.y = mv.x * 0.45;
    sphere.rotation.x = mv.y * 0.3;
    renderer.render(scene, camera);
  })();

  return function cleanup() {
    cancelAnimationFrame(animId);
    canvas.removeEventListener('mousemove', onMove);
    renderer.dispose();
    geo.dispose();
    mat.dispose();
  };
}

function AIAgentOrb() {

}

  const groups = ['Today','Yesterday','Last Week'];

  const q = searchQuery.toLowerCase().trim();

let _vsDropLeft = 130, _vsDropTop = 72, _vsDropWidth = 380; // cached dropdown anchor position

  _setNoonHistory = (v) => { if (v) setTceInsight(false); setNoonHistory(v); };

            animation:'vh-outer 820ms cubic-bezier(0.34,1.05,0.64,1) both',
          }}>
            <!-- Back arrow -->
            <button onClick=${()=>switchTab('documents')} style=${{
              background:'none',border:'none',cursor:'pointer',padding:'6px',

          ${TABS.map(t => {
            const active = tab === t.id;
            return x`
              <button key=${t.id} onClick=${() => switchTab(t.id)} style=${{
                padding:'8px 22px', borderRadius:27, border:'none', cursor:'pointer',
                fontSize:13.5, fontWeight: active ? 600 : 500, transition:'all 150ms',
                background: active ? '#2563EB' : 'transparent',

              </button>`;

        </div>

        <!-- Right spacer to keep pill visually centred -->
        <div style=${{flex:1,display:'flex',justifyContent:'flex-end'}}>
          <span style=${{fontSize:10,color:'#94a3b8',fontWeight:500,letterSpacing:'0.02em',whiteSpace:'nowrap'}}>Noon report · 1 Jan 2026 · 12:22 UTC</span>
        </div>
      </div>

      <!-- ── Content area ── -->
      ${isFullWidth
        ? x`
          <!-- Full-width panel (emails / digital operator) -->
          <div key=${tab} style=${{flex:1,overflow:'hidden',padding:'16px 20px',animation:'panel-slide-in 780ms cubic-bezier(0.34,1.05,0.64,1) 180ms both'}}>
            ${tab==='emails'
              ? x`<${EmailsTab} initialSelected=${approveEmailId} onNavigateToDO=${(id)=>{_doGoToAgent=id;switchTab('operator');}}/>`
              : x`<${DigitalOperatorTab}/>`}
          </div>`
        : x`
          <!-- Normal 2-column layout (V360) -->
          <div style=${{flex:1,display:'flex',overflow:'hidden',padding:'16px 20px',gap:20,position:'relative'}}>

              <${PriorityActionQueue} onApprove=${handleApprove}/>
            </div>
            <!-- Right 60% -->
            <div style=${{flex:1,background:'#F3F4F6',borderRadius:16,overflow:'hidden',display:'flex',flexDirection:'column'}}>
              ${tceInsight
                ? x`<${SmartInsightsPanel} onBack=${()=>setTceInsight(false)}/>`

                ? x`<${Option2Panel} initialView="noon" onBack=${()=>setNoonHistory(false)}/>`
                : x`<div class="scroll" style=${{flex:1,display:'flex',flexDirection:'column',gap:14,overflowY:'auto',overflowX:'hidden',padding:'16px'}}>
                    <${DocumentsTab}/>
                  </div>`
              }
            </div>
          </div>`
      }

    </div>
    </${VesselDataContext.Provider}>`;
}
