<script>
(function () {
  var STEP = 16 * Math.PI / 180;
  var DIAL_R, CENT, ICON_R, LABEL_R;
  function calcGeo() {
    var vw = window.innerWidth || 1440;
    var VIS = Math.round(vw * 0.30);
    DIAL_R = Math.round(VIS * 1.60);
    CENT   = DIAL_R - VIS;
    ICON_R = Math.round(CENT + VIS * 0.31);
    LABEL_R= Math.round(CENT + VIS * 0.54);
  }
  var ACTIONS = [
    { id:'new-task',      label:'New Task',       desc:'Create a new agent task and assign it to the fleet.',
      svg:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="10" y1="15" x2="14" y2="15"/>' },
    { id:'parse-emails',  label:'Parse Emails',   desc:'Essentials for your daily emails that need parsing — AI-agent friendly.',
      svg:'<path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="M16 19h6"/><path d="M19 16v6"/>' },
    { id:'create-sop',    label:'Create New SOP', desc:'Build a reusable SOP your agents can follow automatically.',
      svg:'<path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><polyline points="14 2 14 8 20 8"/><path d="M3 15h6"/><path d="M6 12v6"/>' },
    { id:'upload-doc',    label:'Upload Doc',     desc:'Attach SOF, BL, or DA documents to a task in one drop.',
      svg:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>' },
    { id:'assign-agent',  label:'Assign Agent',   desc:'Delegate a pending task to a specific agent immediately.',
      svg:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
    { id:'new-sof',       label:'New SOF',        desc:'Generate a Statement of Facts from a template in seconds.',
      svg:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
  ];
  var N = ACTIONS.length;
  var curPos = 2, vel = 0, snapIdx = 2, rafId = null, lastT = 0;
  var STIFF = 220, DAMP = 28;
  var drag = null;
  var overlay, trigger, backdrop, closeBtn, disc, spokesEl;
  var iconBtns = [], labelEls = [];

  function springTo(target) {
    snapIdx = Math.max(0, Math.min(N - 1, Math.round(target)));
    if (!rafId) { lastT = 0; rafId = requestAnimationFrame(tick); }
  }
  function tick(ts) {
    var dt = lastT ? Math.min((ts - lastT) / 1000, 0.05) : 0.016;
    lastT = ts;
    var f = STIFF * (snapIdx - curPos) - DAMP * vel;
    vel += f * dt; curPos += vel * dt;
    render();
    if (Math.abs(snapIdx - curPos) > 0.002 || Math.abs(vel) > 0.002) {
      rafId = requestAnimationFrame(tick);
    } else { curPos = snapIdx; vel = 0; rafId = null; render(); }
  }
  function render() {
    var active = Math.round(curPos);
    for (var i = 0; i < N; i++) {
      var angle = Math.PI + (i - curPos) * STEP;
      var cosA = Math.cos(angle), sinA = Math.sin(angle);
      var iconX = ICON_R * cosA, iconY = ICON_R * sinA;
      var lblX  = LABEL_R * cosA, lblY = LABEL_R * sinA;
      var dist  = Math.abs(i - curPos);
      var sc    = Math.max(0.7, 1.2 - dist * 0.16);
      var iAlpha= Math.max(0.4, 1 - dist * 0.22);
      var lAlpha= Math.max(0,   1 - dist * 0.85);
      var isAct = (i === active);
      var btn = iconBtns[i];
      if (btn) { btn.style.transform='translate('+iconX+'px,'+iconY+'px) scale('+sc+')'; btn.style.opacity=iAlpha; btn.classList.toggle('d-active',isAct); }
      var lbl = labelEls[i];
      if (lbl) { lbl.style.transform='translate('+lblX+'px,'+lblY+'px)'; lbl.style.opacity=lAlpha; lbl.classList.toggle('d-active',isAct); }
    }
  }
  function open() {
    overlay.classList.add('d-open'); overlay.setAttribute('aria-hidden','false');
    trigger.style.display='none'; if (closeBtn) closeBtn.focus(); render();
  }
  function close() {
    overlay.classList.remove('d-open'); overlay.setAttribute('aria-hidden','true');
    trigger.style.display=''; trigger.focus();
  }
  function onPtrDown(e) { drag={y:e.clientY,base:curPos}; disc.setPointerCapture&&disc.setPointerCapture(e.pointerId); }
  function onPtrMove(e) { if(!drag)return; var dy=e.clientY-drag.y; var raw=drag.base-dy/72; curPos=Math.max(0,Math.min(N-1,raw)); if(rafId){cancelAnimationFrame(rafId);rafId=null;} render(); }
  function onPtrUp() { if(!drag)return; drag=null; springTo(curPos); }
  function onWheel(e) { e.preventDefault(); springTo(Math.round(curPos)+(e.deltaY>0?1:-1)); }
  function buildSpokes() {
    spokesEl.innerHTML=''; iconBtns=[]; labelEls=[];
    for (var i=0; i<N; i++) {
      var a=ACTIONS[i];
      var btn=document.createElement('button'); btn.type='button'; btn.className='dial-icon-btn'; btn.setAttribute('aria-label',a.label);
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">'+a.svg+'</svg>';
      (function(idx){btn.addEventListener('click',function(){springTo(idx);});})(i);
      spokesEl.appendChild(btn); iconBtns.push(btn);
      var lbl=document.createElement('div'); lbl.className='dial-label';
      lbl.innerHTML='<div class="dial-label-inner"><div class="dial-label-title">'+a.label+'</div><div class="dial-label-desc">'+a.desc+'</div></div>';
      spokesEl.appendChild(lbl); labelEls.push(lbl);
    }
  }
  function applyGeo() {
    var anchor=document.getElementById('dialAnchor');
    if(!anchor||!disc)return;
    disc.style.width=(DIAL_R*2)+'px'; disc.style.height=(DIAL_R*2)+'px';
    disc.style.marginLeft='-'+DIAL_R+'px'; disc.style.marginTop='-'+DIAL_R+'px';
    anchor.style.marginLeft=CENT+'px';
    var rings=disc.querySelectorAll('.dial-ring');
    if(rings[0]){rings[0].style.width=rings[0].style.height=(LABEL_R*2)+'px';}
    if(rings[1]){rings[1].style.width=rings[1].style.height=(ICON_R*2)+'px';}
  }
  function init() {
    overlay=document.getElementById('dialOverlay'); trigger=document.getElementById('qpTrigger');
    backdrop=document.getElementById('dialBackdrop'); closeBtn=document.getElementById('dialClose');
    disc=document.getElementById('dialDisc'); spokesEl=document.getElementById('dialSpokes');
    if(!overlay||!trigger||!disc||!spokesEl)return;
    calcGeo(); applyGeo(); buildSpokes();
    trigger.addEventListener('click',open);
    if(closeBtn)closeBtn.addEventListener('click',close);
    if(backdrop)backdrop.addEventListener('click',close);
    disc.addEventListener('pointerdown',onPtrDown); disc.addEventListener('pointermove',onPtrMove);
    disc.addEventListener('pointerup',onPtrUp); disc.addEventListener('pointercancel',onPtrUp);
    disc.addEventListener('wheel',onWheel,{passive:false});
    document.addEventListener('keydown',function(e){
      if(!overlay.classList.contains('d-open'))return;
      if(e.key==='Escape'){close();return;}
      if(e.key==='ArrowUp'){e.preventDefault();springTo(snapIdx+1);}
      if(e.key==='ArrowDown'){e.preventDefault();springTo(snapIdx-1);}
    });
  }
  init();
  window.addEventListener('resize',function(){calcGeo();applyGeo();render();});
  var ckBtn=document.getElementById('qpChecklist');
  if(ckBtn)ckBtn.addEventListener('click',function(){if(window.openChecklistWorkspace)window.openChecklistWorkspace();});
})();
</script>

<script>
(function(){
  var CK_VESSELS=[
    {id:'nova-horizon',label:'Nova Horizon II'},
    {id:'sti-populr',label:'STI POPULR'},
    {id:'gulf-sentinel',label:'Gulf Sentinel'},
    {id:'atlantic',label:'Atlantic Glory'},
    {id:'maersk',label:'Maersk Tangier'},
  ];
  var CK_TASKS={
    'nova-horizon':[
      {id:'nh-1',done:true,text:'Check vessel risk factor in WINDWARD website (Report if Mod/High)'},
      {id:'nh-2',done:true,text:'Check delivery laycan (TC) / Cargo laycan (VOYAGE)'},
      {id:'nh-3',done:true,text:'Check EU-ETS/FUEL EU clause if included in CP else inform owners'},
      {id:'nh-4',done:true,text:'TCTO - Delivery notice to sub-charterers / TCOV - ETA notices to charterers'},
      {id:'nh-5',done:true,text:'Bunker Plan - sufficient bunkers for sea passage / ECA area / Low Sulphur bunkers'},
      {id:'nh-6',done:true,text:'Send Introductory mail to sub-charterers'},
      {id:'nh-7',done:false,text:'Approve tank cleaning instructions before Singapore arrival'},
      {id:'nh-8',done:false,text:'Confirm port agent appointment at Sharm El Sheikh'},
      {id:'nh-9',done:false,text:'File voyage orders and update voyage management system'},
    ],
    'sti-populr':[
      {id:'sp-1',done:true,text:'Check vessel risk factor in WINDWARD website (Report if Mod/High)'},
      {id:'sp-2',done:true,text:'Check delivery laycan (TC) / Cargo laycan (VOYAGE)'},
      {id:'sp-3',done:true,text:'Check EU-ETS/FUEL EU clause if included in CP else inform owners'},
      {id:'sp-4',done:false,text:'TCTO - Delivery notice to sub-charterers / TCOV - ETA notices to charterers'},
      {id:'sp-5',done:false,text:'Bunker Plan - sufficient bunkers for sea passage / ECA area / Low Sulphur bunkers'},
      {id:'sp-6',done:false,text:'Send Introductory mail to sub-charterers'},
    ],
    'gulf-sentinel':[
      {id:'gs-1',done:true,text:'Check vessel risk factor in WINDWARD website (Report if Mod/High)'},
      {id:'gs-2',done:true,text:'Check delivery laycan (TC) / Cargo laycan (VOYAGE)'},
      {id:'gs-3',done:false,text:'TCTO - Delivery notice to sub-charterers / TCOV - ETA notices to charterers'},
      {id:'gs-4',done:false,text:'Bunker Plan - sufficient bunkers for sea passage / ECA area / Low Sulphur bunkers'},
    ],
    'atlantic':[
      {id:'ag-1',done:false,text:'Check vessel risk factor in WINDWARD website (Report if Mod/High)'},
      {id:'ag-2',done:false,text:'Check delivery laycan (TC) / Cargo laycan (VOYAGE)'},
      {id:'ag-3',done:false,text:'Send Introductory mail to sub-charterers'},
    ],
    'maersk':[
      {id:'mk-1',done:true,text:'Check vessel risk factor in WINDWARD website (Report if Mod/High)'},
      {id:'mk-2',done:false,text:'Bunker Plan - sufficient bunkers for sea passage / ECA area / Low Sulphur bunkers'},
      {id:'mk-3',done:false,text:'Send Introductory mail to sub-charterers'},
    ],
  };
  var currentVessel='nova-horizon';
  try{var saved=JSON.parse(localStorage.getItem('ck-tasks-vessel')||'{}');Object.keys(CK_TASKS).forEach(function(vid){CK_TASKS[vid].forEach(function(t){if(saved.hasOwnProperty(t.id))t.done=saved[t.id];});});}catch(e){}
  function saveState(){try{var s={};Object.keys(CK_TASKS).forEach(function(vid){CK_TASKS[vid].forEach(function(t){s[t.id]=t.done;});});localStorage.setItem('ck-tasks-vessel',JSON.stringify(s));}catch(e){}}
  var panel=document.getElementById('ckWorkspace'),backdrop=document.getElementById('ckBackdrop');
  var tabsEl=document.getElementById('ckTabs'),listEl=document.getElementById('ckList'),searchEl=document.getElementById('ckSearch');
  var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var DEL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var PIN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>';
  function renderTabs(){
    tabsEl.innerHTML=CK_VESSELS.map(function(v){return '<button class="ck-tab'+(v.id===currentVessel?' ck-tab-active':'')+'" data-ves="'+v.id+'">'+'<span class="ck-tab-label">'+v.label+'</span>'+'<span class="ck-tab-acts"><span class="ck-tab-act" data-pin="'+v.id+'" title="Pin to front">'+PIN_SVG+'</span><span class="ck-tab-act" data-del="'+v.id+'" title="Remove">'+DEL_SVG+'</span></span>'+'</button>';}).join('');
  }
  function renderList(query){
    query=(query||'').toLowerCase().trim();
    var tasks=(CK_TASKS[currentVessel]||[]).filter(function(t){return !query||t.text.toLowerCase().indexOf(query)!==-1;});
    if(!tasks.length){listEl.innerHTML='<div class="ck-empty">No tasks found</div>';return;}
    listEl.innerHTML=tasks.map(function(t,i){
      var last=i===tasks.length-1;
      var dot=t.done?'<div class="ck-dot ck-dot-done">'+CHECK_SVG+'</div>':'<div class="ck-dot ck-dot-pending"></div>';
      var conn=last?'':'<div class="ck-connector"></div>';
      return '<div class="ck-item'+(t.done?' ck-done':'')+'" data-tid="'+t.id+'" data-vid="'+currentVessel+'">'+'<div class="ck-indicator">'+dot+conn+'</div>'+'<div class="ck-text">'+t.text+'</div></div>';
    }).join('');
  }
  tabsEl.addEventListener('click',function(e){
    var delV=e.target.closest('[data-del]');
    if(delV){e.stopPropagation();var did=delV.dataset.del;CK_VESSELS=CK_VESSELS.filter(function(v){return v.id!==did;});if(currentVessel===did)currentVessel=CK_VESSELS[0]?CK_VESSELS[0].id:'';renderTabs();renderList(searchEl.value);return;}
    var pinV=e.target.closest('[data-pin]');
    if(pinV){e.stopPropagation();var pid=pinV.dataset.pin;var pi=CK_VESSELS.findIndex(function(v){return v.id===pid;});if(pi>0){CK_VESSELS.unshift(CK_VESSELS.splice(pi,1)[0]);}renderTabs();return;}
    var tab=e.target.closest('.ck-tab[data-ves]');
    if(!tab)return;
    currentVessel=tab.dataset.ves;
    tabsEl.querySelectorAll('.ck-tab').forEach(function(b){b.classList.remove('ck-tab-active');});
    tab.classList.add('ck-tab-active');
    renderList(searchEl.value);
  });
  searchEl.addEventListener('input',function(){renderList(this.value);});
  listEl.addEventListener('click',function(e){
    var item=e.target.closest('.ck-item');
    if(!item)return;
    var tid=item.dataset.tid,vid=item.dataset.vid||currentVessel;
    var tasks=CK_TASKS[vid]||[];
    for(var i=0;i<tasks.length;i++){if(tasks[i].id===tid){tasks[i].done=!tasks[i].done;saveState();renderList(searchEl.value);break;}}
  });
  document.getElementById('ckClose').addEventListener('click',close);
  backdrop.addEventListener('click',close);
  function open(){renderTabs();renderList(searchEl.value);panel.classList.add('ck-open');backdrop.classList.add('ck-visible');setTimeout(function(){searchEl.focus();},420);}
  function close(){panel.classList.remove('ck-open');backdrop.classList.remove('ck-visible');}
  window.openChecklistWorkspace=open;
})();
</script>
