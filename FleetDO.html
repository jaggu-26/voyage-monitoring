<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Geonix — Digital Operators</title>
  <style>
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Regular.woff2')format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Medium.woff2')format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-SemiBold.woff2')format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'Gilroy';src:url('assets/Gilroy-Bold.woff2')format('woff2');font-weight:700;font-display:swap}
    *{font-family:'Gilroy',-apple-system,system-ui,sans-serif;box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{display:flex;background:#fff}
    :root{
      --sidebar-width:220px;--sidebar-width-collapsed:52px;
      --color-sidebar:#ffffff;--color-sidebar-hover:#F7FAFC;
      --color-sidebar-active:#EEF6FF;--color-sidebar-text:#64748b;
      --color-sidebar-text-active:#1852FE;--color-border-nav:#e4e9f2;
      --color-surface-subtle:#f1f5f9;--color-text-default:#0E1A33;
      --color-text-secondary:#5a6b85;--color-text-placeholder:#94a3b8;
      --prim-marine:#001E4C;
    }
    .nav-rail{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--color-sidebar);display:flex;flex-direction:column;height:100vh;flex-shrink:0;overflow:hidden;transition:width 220ms ease;border-right:1px solid var(--color-border-nav);contain:layout style paint}
    .nav-rail.collapsed{min-width:var(--sidebar-width-collapsed)}
    .nav-rail.collapsed{width:var(--sidebar-width-collapsed)}
    .sidebar-logo{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--color-border-nav);overflow:hidden}
    .sidebar-logo-icon{width:22px;height:22px;flex-shrink:0}
    .sidebar-logo-text{flex:1;overflow:hidden;white-space:nowrap}
    .nav-rail.collapsed .sidebar-logo-text{opacity:0;width:0;pointer-events:none}
    .sidebar-logo-name{font-size:14px;font-weight:600;color:var(--color-text-default);letter-spacing:-0.2px}
    .sidebar-logo-sub{font-size:10px;color:var(--color-text-placeholder)}
    .nav-collapse-btn{border:none;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);border-radius:4px;padding:4px;transition:background 120ms,color 120ms}
    .nav-collapse-btn:hover{background:var(--color-surface-subtle);color:var(--color-text-default)}
    .collapse-chevron{width:15px;height:15px;display:block}
    .collapse-hamburger{width:18px;height:18px;display:none}
    .nav-rail.collapsed .collapse-chevron{display:none}
    .nav-rail.collapsed .collapse-hamburger{display:block}
    .nav-rail.collapsed .sidebar-logo{padding:16px 0;justify-content:center;gap:0}
    .nav-rail.collapsed .sidebar-logo-text{flex:0 0 0;width:0}
    .nav-rail.collapsed .sidebar-logo-icon{display:none}
    .nav-rail.collapsed .sidebar-logo .nav-collapse-btn{width:24px;height:24px;border-radius:4px;padding:3px}
    .sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none}
    .sidebar-nav::-webkit-scrollbar{display:none}
    .nav-rail.collapsed .sidebar-nav{overflow:visible;display:flex;flex-direction:column;justify-content:flex-start;}
    .nav-section{display:flex;flex-direction:column;gap:4px;padding:0 8px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;font-size:13.5px;color:var(--color-sidebar-text);cursor:pointer;transition:background 120ms,color 120ms;text-decoration:none;white-space:nowrap;overflow:hidden;border-radius:8px}
    .nav-item:hover{background:var(--color-sidebar-hover);color:var(--color-text-default)}
    .nav-item.active{background:var(--color-sidebar-active);color:var(--color-sidebar-text-active)}
    .nav-item svg{width:20px;height:20px;flex-shrink:0}
    .nav-item-label{flex:1;overflow:hidden;transition:opacity 150ms}
    .nav-rail.collapsed .nav-section{padding:16px 0 0;gap:14px;align-items:center;}
    .nav-rail.collapsed .nav-item{height:32px;width:32px;justify-content:center;align-items:center;padding:0;gap:0;border-left:none!important;border-radius:4px;background:transparent;}
    .nav-rail.collapsed .nav-item:hover{background:var(--color-sidebar-hover);}
    .nav-rail.collapsed .nav-item.active{background:#eef6ff;}
    .nav-rail.collapsed .nav-item svg{width:19px;height:19px;}
    .nav-rail.collapsed .nav-item-label{opacity:0;flex:0 0 0;width:0;overflow:hidden}
    .sidebar-footer{flex-shrink:0;padding:10px 0;border-top:1px solid var(--color-border-nav)}
    .sidebar-user{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;overflow:hidden;white-space:nowrap;transition:background 120ms}
    .sidebar-user:hover{background:var(--color-sidebar-hover)}
    .nav-rail.collapsed .sidebar-user{justify-content:center;padding:10px;gap:0}
    .nav-avatar{width:28px;height:28px;border-radius:9999px;background:#001E4C;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0}
    .sidebar-user-info{flex:1;overflow:hidden;transition:opacity 150ms}
    .nav-rail.collapsed .sidebar-user-info{opacity:0;flex:0 0 0;width:0}
    .sidebar-user-name{font-size:13px;font-weight:600;color:var(--color-text-default)}
    .sidebar-user-role{font-size:11px;color:var(--color-text-placeholder);margin-top:1px}
    .scroll{scrollbar-width:thin;scrollbar-color:#e4e9f2 transparent}
    .scroll::-webkit-scrollbar{width:4px;height:4px}
    .scroll::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:99px}
    .scroll::-webkit-scrollbar-track{background:transparent}
    .hscroll{scrollbar-width:none}
    .hscroll::-webkit-scrollbar{display:none}
    /* ── Top operator cards (Figma node 7598:28879) — gradient stroke per status ── */
    .gx-op-card{
      position:relative;flex-shrink:0;width:280px;box-sizing:border-box;
      display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:8px;
      cursor:pointer;border:1px solid transparent;
    }
    .gx-op-card--active{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#2463eb,rgba(36,99,235,0)) border-box;
    }
    .gx-op-card--active:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#2463eb,rgba(36,99,235,0)) border-box;
    }
    .gx-op-card--pending{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#ca8a03,rgba(202,138,3,0)) border-box;
    }
    .gx-op-card--pending:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#ca8a03,rgba(202,138,3,0)) border-box;
    }
    .gx-op-card--completed{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#1b9e4b,rgba(27,158,75,0)) border-box;
    }
    .gx-op-card--completed:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#1b9e4b,rgba(27,158,75,0)) border-box;
    }
    .gx-op-card--high-alert{
      background:linear-gradient(#10172a,#10172a) padding-box,
                 linear-gradient(180deg,#dc2625,rgba(220,38,37,0)) border-box;
    }
    .gx-op-card--high-alert:hover{
      background:linear-gradient(#1e293b,#1e293b) padding-box,
                 linear-gradient(180deg,#dc2625,rgba(220,38,37,0)) border-box;
    }
    .gx-op-card.gx-op-card--selected,.gx-op-card.gx-op-card--selected:hover{
      background:linear-gradient(rgba(31,58,138,0.8),rgba(31,58,138,0.8)) padding-box;
      border-color:#5fa5f9;
    }
    /* #03 — below 1400px (or 125% Windows scaling) height is scarce: drop the company/counterparty
       meta line from operator cards so the carousel takes less vertical space */
    @media (max-width:1399px){
      .gx-op-meta-extra{display:none!important;}
    }
    /* "In progress" status — pulsing dots read as active AI work, not a static icon (ported from vessel360.html) */
    .gx-icon-dots .gx-dot{transform-box:fill-box;transform-origin:center;animation:gx-dot-pulse 1.2s ease-in-out infinite}
    .gx-icon-dots .gx-dot:nth-child(1){animation-delay:0ms}
    .gx-icon-dots .gx-dot:nth-child(2){animation-delay:160ms}
    .gx-icon-dots .gx-dot:nth-child(3){animation-delay:320ms}
    @keyframes gx-dot-pulse{0%,60%,100%{opacity:0.35;transform:scale(0.75)}30%{opacity:1;transform:scale(1.15)}}
    /* "Pending" status — a slow breathing pulse signals it's waiting, not idle */
    .gx-icon-pending{transform-box:fill-box;transform-origin:center;animation:gx-pending-breathe 1.8s ease-in-out infinite}
    @keyframes gx-pending-breathe{0%,100%{opacity:0.55;transform:scale(0.92)}50%{opacity:1;transform:scale(1.08)}}
    @media (prefers-reduced-motion: reduce){.gx-icon-dots .gx-dot,.gx-icon-pending{animation:none}}
    /* #02 — panel expand affordance */
    .gx-panel-inactive:hover{background:#fff!important;border-color:#94A3B8!important;box-shadow:0 0 0 0px transparent,0 2px 8px rgba(0,0,0,0.06)!important}
    /* ── Vessel Intelligence: Quick View accordion + reasoning-item interaction (Figma 7622:30486 / 6877:18210) ── */
    .gx-qv-chip{height:32px;padding:8px;border-radius:4px;border:1px solid #e2e8f0;background:#fff;color:#1e293b;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:background 120ms,border-color 120ms}
    .gx-qv-chip:hover{background:#eef6ff;border-color:#5fa5f9}
    .gx-qv-chip--active,.gx-qv-chip--active:hover{background:#001E4C;border-color:#001E4C;color:#fff}
    .gx-ri{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:36px;padding:4px 12px;border-bottom:1px dashed #e2e8f0;background:#fff;transition:background 700ms ease}
    .gx-ri:last-child{border-bottom:none}
    .gx-ri:hover{background:#eef6ff;padding:2px 8px 2px 12px}
    .gx-ri:hover .gx-ri-actions{display:flex}
    .gx-ri--readonly:hover{background:#fff;padding:4px 12px}
    .gx-ri--error{border-left:3px solid #dc2625}
    .gx-ri--flash{background:#fef1f2!important;transition:background 200ms ease}
    .gx-ri-actions{display:none;align-items:center;gap:4px;flex-shrink:0}
    .gx-ri-actions button{width:24px;height:24px;border:none;background:transparent;cursor:pointer;color:#5a6b85;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0}
    .gx-ri-actions button:hover{background:rgba(0,0,0,0.06)}
    .gx-ri--excluded .gx-ri-label,.gx-ri--excluded .gx-ri-value{opacity:0.4;text-decoration:line-through}
    .gx-accordion-header{background:#fff;display:flex;align-items:center;gap:16px;padding:8px 12px;width:100%;border:none;cursor:pointer;font-family:inherit;transition:background 120ms}
    .gx-accordion-header:hover{background:#eef6ff}
    .gx-accordion-footer{background:#fff;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:flex-end;padding:12px 16px}
    .gx-accordion-footer button{display:inline-flex;align-items:center;gap:4px;height:32px;padding:4px 12px;border-radius:4px;border:none;background:#fff;color:#334154;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
    .gx-accordion-footer button:hover{background:#f1f5f9}
    .gx-accordion-footer button.gx-excluded-active{color:#1852FE}
    /* #20 — avatar hover */
    .sidebar-user:focus-visible{outline:2px solid #1852FE;outline-offset:2px}
    .sidebar-user[aria-label]{cursor:pointer}
    /* ── Quick Actions floating buttons ── */
    .qp-btn-group {
      position:fixed; right:0; top:50%; transform:translateY(-50%);
      z-index:490; display:flex; flex-direction:column; gap:8px; align-items:flex-end;
    }
    .qp-dial-btn {
      width:40px; height:52px;
      border-radius:14px 0 0 14px;
      background:linear-gradient(170deg,#2f6cff 0%,#1140c9 100%);
      border:none; cursor:pointer; color:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow:-4px 0 18px rgba(24,82,254,0.40);
      padding:0 10px 0 14px;
      transition:width 180ms ease, padding-right 180ms ease, box-shadow 180ms ease;
      flex-shrink:0;
    }
    .qp-dial-btn:hover { width:52px; padding-right:16px; box-shadow:-8px 0 28px rgba(24,82,254,0.55); }
    .qp-dial-btn-ico { width:20px; height:20px; flex-shrink:0; display:block; }
    /* ── Dial Overlay ── */
    .dial-overlay { position:fixed; inset:0; z-index:500; overflow:hidden; pointer-events:none; }
    .dial-overlay.d-open { pointer-events:all; }
    .dial-backdrop { position:absolute; inset:0; background:rgba(8,17,34,0.42); opacity:0; transition:opacity 400ms ease; }
    .dial-overlay.d-open .dial-backdrop { opacity:1; }
    .dial-hdr { position:absolute; right:32px; top:28px; z-index:30; display:flex; align-items:center; gap:20px; opacity:0; transition:opacity 250ms 150ms ease; pointer-events:none; }
    .dial-overlay.d-open .dial-hdr { opacity:1; pointer-events:all; }
    .dial-hdr-title { font-size:15px; font-weight:600; letter-spacing:0.2px; color:rgba(255,255,255,0.9); font-family:'Gilroy',-apple-system,system-ui,sans-serif; }
    .dial-close-btn { width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,0.15); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 150ms; }
    .dial-close-btn:hover { background:rgba(255,255,255,0.28); }
    .dial-close-btn svg { width:18px; height:18px; }
    .dial-anchor { position:absolute; left:100%; top:50%; }
    .dial-disc { position:absolute; border-radius:50%; background:radial-gradient(120% 120% at 80% 50%,#3f78ff 0%,#1f54ef 46%,#123fd0 100%); box-shadow:-30px 0 120px rgba(17,64,208,0.45); cursor:grab; user-select:none; touch-action:none; transform:scale(0); opacity:0.5; transition:transform 550ms cubic-bezier(.33,0,.2,1), opacity 300ms ease; }
    .dial-disc:active { cursor:grabbing; }
    .dial-overlay.d-open .dial-disc { transform:scale(1); opacity:1; }
    .dial-ring { position:absolute; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
    .dial-ring.r1 { border:1px solid rgba(255,255,255,0.10); }
    .dial-ring.r2 { border:1px solid rgba(255,255,255,0.15); }
    .dial-spokes { position:absolute; left:0; top:0; opacity:0; transition:opacity 300ms 180ms ease; }
    .dial-overlay.d-open .dial-spokes { opacity:1; }
    .dial-icon-btn { position:absolute; left:0; top:0; width:56px; height:56px; border-radius:18px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.10); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:-28px; margin-top:-28px; will-change:transform; z-index:20; transition:background 200ms,border-color 200ms,color 200ms,box-shadow 200ms; }
    .dial-icon-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; }
    .dial-icon-btn.d-active { background:#fff; border-color:#fff; color:#1852fe; box-shadow:0 8px 32px rgba(17,64,208,0.50); }
    .dial-label { position:absolute; left:0; top:0; z-index:10; width:320px; text-align:right; margin-left:-320px; will-change:transform; pointer-events:none; }
    .dial-label-inner { transform:translateY(-50%); }
    .dial-label-title { font-size:16px; font-weight:800; line-height:1.2; letter-spacing:-0.3px; color:rgba(255,255,255,0.55); font-family:'Gilroy',-apple-system,system-ui,sans-serif; transition:font-size 300ms ease,color 300ms ease; }
    .dial-label.d-active .dial-label-title { font-size:26px; color:#fff; }
    .dial-label-desc { margin-top:10px; font-size:13.5px; line-height:1.6; color:rgba(255,255,255,0.80); max-width:270px; margin-left:auto; font-family:'Gilroy',-apple-system,system-ui,sans-serif; max-height:0; overflow:hidden; opacity:0; transition:max-height 280ms ease,opacity 250ms ease; }
    .dial-label.d-active .dial-label-desc { max-height:80px; opacity:1; }
    /* ── Checklist Workspace ── */
    #ckBackdrop { position:fixed; inset:0; z-index:890; background:rgba(0,0,0,0.13); opacity:0; pointer-events:none; transition:opacity 350ms cubic-bezier(0.4,0,0.2,1); }
    #ckBackdrop.ck-visible { opacity:1; pointer-events:auto; }
    #ckWorkspace { position:fixed; top:0; right:0; bottom:0; z-index:900; width:430px; max-width:100vw; display:flex; flex-direction:column; background:linear-gradient(170deg,#0c2070 0%,#1340c9 18%,#1852FE 100%); border-radius:24px 0 0 24px; box-shadow:-10px 0 70px rgba(14,26,51,0.40),-2px 0 16px rgba(24,82,254,0.22); transform:translateX(100%); transition:transform 400ms cubic-bezier(0.4,0,0.2,1); overflow:hidden; }
    #ckWorkspace.ck-open { transform:translateX(0); }
    .ck-hdr { flex-shrink:0; background:rgba(0,0,0,0.18); padding:16px 20px 0; border-radius:24px 0 0 0; }
    .ck-hdr-inner { display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:14px; }
    .ck-title { font-size:15px; font-weight:700; color:#fff; letter-spacing:0.01em; }
    .ck-close-btn { position:absolute; right:0; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:8px; background:transparent; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.55); transition:color 150ms,background 150ms; }
    .ck-close-btn:hover { background:rgba(255,255,255,0.10); color:#fff; }
    .ck-close-btn svg { width:15px; height:15px; }
    .ck-search-wrap { position:relative; margin-bottom:14px; }
    .ck-search-ico { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:rgba(255,255,255,0.40); pointer-events:none; }
    .ck-search { width:100%; box-sizing:border-box; height:36px; padding:0 12px 0 33px; background:rgba(0,30,76,0.32); border:1px solid #1d40af; border-radius:8px; font-family:'Gilroy',-apple-system,system-ui,sans-serif; font-size:13px; font-weight:500; color:#fff; outline:none; transition:border-color 150ms,background 150ms; }
    .ck-search::placeholder { color:rgba(255,255,255,0.38); }
    .ck-search:focus { border-color:rgba(255,255,255,0.38); background:rgba(0,30,76,0.48); }
    .ck-tabs { display:flex; align-items:center; gap:4px; overflow-x:auto; padding:2px 20px 16px; scrollbar-width:none; }
    .ck-tabs::-webkit-scrollbar { display:none; }
    .ck-tab { flex-shrink:0; padding:6px 14px; font-family:'Gilroy',-apple-system,system-ui,sans-serif; font-size:11.5px; font-weight:600; border:1px solid transparent; cursor:pointer; background:transparent; color:rgba(255,255,255,0.42); border-radius:9999px; white-space:nowrap; transition:color 160ms,background 160ms,border-color 160ms; }
    .ck-tab:hover:not(.ck-tab-active) { color:rgba(255,255,255,0.75); background:rgba(255,255,255,0.08); }
    .ck-tab.ck-tab-active { background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.22); color:#fff; font-weight:700; }
    .ck-tab-del { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:rgba(255,255,255,0.22); border:none; cursor:pointer; padding:0; color:rgba(255,255,255,0.90); margin-left:9px; flex-shrink:0; vertical-align:middle; transition:background 150ms; line-height:0; }
    .ck-tab-del:hover { background:rgba(255,255,255,0.45); }
    .ck-tab-del svg { width:8px; height:8px; display:block; }
    .ck-tab-label { pointer-events:none; }
    .ck-tab-acts { display:none; align-items:center; gap:5px; pointer-events:none; }
    .ck-tab:hover .ck-tab-label { display:none; }
    .ck-tab:hover .ck-tab-acts { display:flex; }
    .ck-tab-act { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,0.15); cursor:pointer; color:rgba(255,255,255,0.9); flex-shrink:0; pointer-events:all; transition:background 150ms; }
    .ck-tab-act:hover { background:rgba(255,255,255,0.38); }
    .ck-tab-act svg { width:9px; height:9px; display:block; pointer-events:none; }
    .ck-body { flex:1; overflow-y:auto; padding:6px 20px 28px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.14) transparent; }
    .ck-body::-webkit-scrollbar { width:3px; }
    .ck-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.16); border-radius:9999px; }
    .ck-list { position:relative; }
    .ck-item { display:flex; align-items:flex-start; gap:12px; padding:9px 0; cursor:pointer; }
    .ck-indicator { display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:20px; padding-top:1px; }
    .ck-dot { width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform 220ms cubic-bezier(0.34,1.10,0.64,1),opacity 180ms; }
    .ck-dot-done { background:rgba(255,255,255,0.96); }
    .ck-dot-done svg { width:11px; height:11px; color:#1852FE; }
    .ck-dot-pending { width:14px; height:14px; border-radius:50%; background:transparent; border:2px solid rgba(255,255,255,0.28); margin:3px; }
    .ck-item:hover .ck-dot { transform:scale(1.12); }

/* ── Generic dark-bar dropdown: portal panel so it never gets clipped by an overflow:hidden ancestor ── */
function Dropdown({ value, onChange, options, style, placeholder, chevronColor }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const btnRef = useRef(null);
  const current = options.find(o => o.id === value) || options[0];
  const toggleOpen = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 6, left: r.left, width: r.width });
    }
    setOpen(o => !o);
  };
  return x`
    <div style=${{position:'relative',flexShrink:0,width:style&&style.width?style.width:'auto'}}>
      <button ref=${btnRef} onClick=${toggleOpen} style=${{...style,width:'100%',display:'flex',alignItems:'center',gap:7,position:'relative',textAlign:'left'}}>
        ${current.color ? x`<span style=${{width:8,height:8,borderRadius:'50%',background:current.color,flexShrink:0}}/>` : null}
        <span style=${{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${current ? current.label : placeholder}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke=${chevronColor||"rgba(255,255,255,0.4)"} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style=${{flexShrink:0}}><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      ${open && pos ? createPortal(x`
        <${Fragment}>
          <div onClick=${()=>setOpen(false)} style=${{position:'fixed',inset:0,zIndex:2998}}/>
          <div style=${{position:'fixed',top:pos.top,left:pos.left,minWidth:Math.max(170,pos.width),maxHeight:320,overflowY:'auto',zIndex:2999,background:'#fff',borderRadius:10,boxShadow:'0 8px 28px rgba(0,0,0,0.22)',border:'1px solid #e4e9f2'}}>
            ${options.map(opt => {
              const sel = value === opt.id;
              return x`
                <div key=${opt.id} onClick=${()=>{onChange(opt.id);setOpen(false);}}
                  style=${{display:'flex',alignItems:'center',gap:9,padding:'9px 12px',cursor:'pointer',background:sel?'#EEF4FF':'#fff',transition:'background 100ms'}}>
                  ${opt.color ? x`<span style=${{width:8,height:8,borderRadius:'50%',background:opt.color,flexShrink:0}}/>` : null}
                  <span style=${{flex:1,fontSize:13,fontWeight:sel?700:400,color:sel?'#1852FE':'#0E1A33',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${opt.label}</span>
                  ${sel ? x`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1852FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style=${{flexShrink:0}}><polyline points="20 6 9 17 4 12"/></svg>` : null}
                </div>`;
            })}
          </div>
        </${Fragment}>`, document.body) : null}
    </div>`;
}

/* ── Agent carousel: top operator cards (Figma node 7598:28879) ── */
function AgentCarousel({ tasks, selectedId, onSelect, statusFilter }) {
  const scrollRef = useRef(null);
  const [fade, setFade] = useState({ left:false, right:false });
  const [hover, setHover] = useState(false);
  const emptyLabel = statusFilter && statusFilter !== 'all'
    ? `You don't have any ${(STATUS_META[statusFilter]?.label || statusFilter).toLowerCase()} alerts.`
    : 'No agents found';

  const checkFade = () => {
    const el = scrollRef.current;
    if (!el) return;
    const scrollable = el.scrollWidth > el.clientWidth + 1;
    setFade({
      left: scrollable && el.scrollLeft > 2,
      right: scrollable && el.scrollLeft < el.scrollWidth - el.clientWidth - 2,
    });
  };

  useEffect(() => {
    checkFade();
    window.addEventListener('resize', checkFade);
    return () => window.removeEventListener('resize', checkFade);
  }, [tasks]);

  const seekCards = dir => {
    const el = scrollRef.current;
    if (el) el.scrollBy({ left: dir*280, behavior:'smooth' });
  };

  return x`
    <div onMouseEnter=${()=>setHover(true)} onMouseLeave=${()=>setHover(false)} style=${{flexShrink:0,background:'#07111F',position:'relative'}}>
      <div ref=${scrollRef} onScroll=${checkFade} class="hscroll" style=${{display:'flex',gap:16,overflowX:'auto',padding:'10px 16px 14px'}}>
        ${tasks.length === 0 ? x`
          <div style=${{width:'100%',height:130,display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,0.32)',fontSize:13}}>
            ${emptyLabel}
          </div>` : tasks.map(t => {
          const sel = t.id === selectedId;
          const sm = STATUS_META[t.status];
          const StatusIcon = STATUS_ICONS[sm.icon];
          return x`
            <div key=${t.id} onClick=${()=>onSelect(t.id)}
              class=${'gx-op-card '+sm.cardClass+(sel?' gx-op-card--selected':'')}>
              <div style=${{display:'flex',flexDirection:'column',gap:8,width:'100%'}}>
                <div title=${t.task} style=${{fontSize:14,lineHeight:'20px',fontWeight:600,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',width:'100%'}}>${t.task}</div>
                <${OpMeta} icon=${x`<${IconShip}/>`} label=${t.vesselName+', '+t.voyage}/>
              </div>
              <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',marginTop:'auto'}}>
                <div style=${{display:'flex',alignItems:'center',gap:4}}>
                  <${IconAi}/>
                  <span style=${{fontSize:12,lineHeight:'16px',fontWeight:500,color:'#64748B',whiteSpace:'nowrap'}}>${t.agent}</span>
                </div>
                <${Tip} variant="gx-tt-white" bubble=${sm.label}><${StatusIcon}/></${Tip}>
              </div>
            </div>`;
        })}
      </div>
      ${fade.left ? x`<div style=${{position:'absolute',left:0,top:0,bottom:0,width:50,background:'linear-gradient(90deg,#07111F,rgba(7,17,31,0))',pointerEvents:'none'}}/>` : null}
      ${fade.right ? x`<div style=${{position:'absolute',right:0,top:0,bottom:0,width:50,background:'linear-gradient(270deg,#07111F,rgba(7,17,31,0))',pointerEvents:'none'}}/>` : null}
      ${fade.left ? x`
        <button class=${'gx-card-seek gx-card-seek--left'+(hover?' gx-card-seek--visible':'')} onClick=${()=>seekCards(-1)} aria-label="Scroll left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>` : null}
      ${fade.right ? x`
        <button class=${'gx-card-seek gx-card-seek--right'+(hover?' gx-card-seek--visible':'')} onClick=${()=>seekCards(1)} aria-label="Scroll right">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>` : null}
    </div>`;
}

/* ── Cargo Parameters table (Tank Cleaning reasoning panel) ── */
function CargoParamsTable({ fields }) {
  const initVals = {};
  const defaultOn = new Set(['oxyFree','fameFree','coatingsGood','hasIGS','isMPP']);
  fields.forEach(f => {
    if (f.type === 'toggle') initVals[f.key] = defaultOn.has(f.key) ? 'yes' : null;
    else if (f.type === 'number') initVals[f.key] = '';
    else if (f.type === 'dropdown') initVals[f.key] = '';
    else initVals[f.key] = f.value || '';
  });
  const [vals, setVals] = useState(initVals);
  const set = (k, v) => setVals(prev => ({...prev, [k]: v}));
  const [hoveredRow, setHoveredRow] = useState(null);

  return x`
  <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr'}}>
    ${fields.map((f, i) => {
      const isLast = i === fields.length - 1;
      const bdr = isLast ? 'none' : '1px dashed #e2e8f0';
      const val = vals[f.key];
      const isHovered = hoveredRow === i;
      const bg = isHovered ? '#eef6ff' : '#fff';
      let control;
      if (f.type === 'toggle') {
        const isOn = val === 'yes';
        control = x`
        <div onClick=${()=>set(f.key, isOn ? 'no' : 'yes')}
          style=${{
            display:'inline-flex', alignItems:'center', cursor:'pointer', userSelect:'none',
            width:44, height:24, borderRadius:99, padding:2, boxSizing:'border-box',
            background: isOn ? '#1852FE' : '#CBD5E1',
            transition:'background 200ms ease', flexShrink:0,
          }}>
          <div style=${{
            width:20, height:20, borderRadius:'50%', background:'#fff',
            boxShadow:'0 1px 3px rgba(0,0,0,0.25)',
            transform: isOn ? 'translateX(20px)' : 'translateX(0px)',
            transition:'transform 200ms ease',
          }}></div>
        </div>`;
      } else if (f.type === 'number') {
        control = x`<input type="number" value=${val} onInput=${e=>set(f.key, e.target.value)}
          style=${{border:'1px solid #CBD5E1',borderRadius:4,padding:'4px 8px',fontSize:13,
            width:'100%',boxSizing:'border-box',fontFamily:'inherit',outline:'none',color:'#001E4C'}} placeholder="—"/>`;
      } else if (f.type === 'dropdown') {
        const ddOpts = [{id:'', label:'Select…'}, ...f.options.map(o => ({id:o, label:o}))];
        control = x`<${Dropdown}
          value=${val||''}
          onChange=${v => set(f.key, v)}
          options=${ddOpts}
          chevronColor="#64748B"
          style=${{
            height:32, width:'100%', borderRadius:6,

            padding:'0 8px', cursor:'pointer', boxSizing:'border-box',

          padding:'3px 10px',fontSize:12,fontWeight:600,color:'#1852FE',display:'inline-flex',alignItems:'center'}}>${f.value}</span>`;
      }
      return [
        x`<div key=${'l'+i}
          onMouseEnter=${()=>setHoveredRow(i)} onMouseLeave=${()=>setHoveredRow(null)}

/* ── Hover tooltip rendered via portal to <body> so it never clips inside a scrolling card ── */
function Tip({ children, variant, bubble }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const show = () => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    setPos({ x: r.left + r.width / 2, y: r.top });
  };
  const hide = () => setPos(null);
  return x`
    <span ref=${ref} class="gx-tt" onMouseEnter=${show} onMouseLeave=${hide}>
      ${children}
      ${pos ? createPortal(x`
        <div class=${'gx-tt-portal '+variant} style=${{position:'fixed',left:pos.x+'px',top:pos.y+'px',transform:'translate(-50%, calc(-100% - 9px))'}}>
          ${bubble}
        </div>`, document.body) : null}
    </span>`;
}

                Save

            </div>
          </div>
        </div>
      ` : null}
    </div>
  `;
}

function EditCargoModal({ type, cargos, onClose }) {
  const title = type === 'next' ? 'Edit Next Cargo' : 'Edit Previous Cargo';
  const entryLabel = type === 'next' ? 'Next Cargo' : 'Previous Cargo';
  const addLabel = type === 'next' ? 'Add another next cargo' : 'Add another previous cargo';
  const FIELDS = [
    { key:'intendedUse',               label:'Intended Use',                  type:'select', opts:['Heating','Transport','Blending','Export'] },
    { key:'containsFAME',              label:'Contains FAME',                 type:'toggle' },
    { key:'containsAlcohol',           label:'Contains Alcohol',              type:'toggle' },
    { key:'fameFree',                  label:'FAME Free',                     type:'toggle' },
    { key:'aromaticsSulphurSensitive', label:'Aromatics / Sulphur Sensitive', type:'toggle' },
    { key:'mtbeNotPermitted',          label:'MTBE Not Permitted',            type:'toggle' },
    { key:'alcoholDirection',          label:'Alcohol Change Direction',       type:'select', opts:['MeOH→EtOH','EtOH→MeOH'] },
    { key:'hasBuffer',                 label:'Has Buffer',                    type:'toggle' },
  ];
  const initEntry = name => ({ name, intendedUse:'', containsFAME:false, containsAlcohol:false, fameFree:false, aromaticsSulphurSensitive:false, mtbeNotPermitted:false, alcoholDirection:'', hasBuffer:false });
  const [entries, setEntries] = useState(() => cargos.map(initEntry));
  const [activeTab, setActiveTab] = useState(0);
  const setField = (i, key, val) => setEntries(prev => prev.map((e, idx) => idx===i ? {...e, [key]:val} : e));
  const addEntry = () => {
    setEntries(prev => [...prev, initEntry('')]);

      <div style=${{background:'#F8FAFC',borderRadius:16,width:'100%',maxWidth:500,maxHeight:'85vh',display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(14,26,51,0.22)'}}>
        <!-- Header -->
        <div style=${{padding:'20px 24px 16px',background:'#fff',borderRadius:'16px 16px 0 0',flexShrink:0}}>
          <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>

            <div style=${{display:'flex',alignItems:'center',gap:10}}>
              <button onClick=${addEntry}
                style=${{display:'flex',alignItems:'center',gap:5,background:'none',border:'none',padding:0,cursor:'pointer',fontSize:13,fontWeight:600,color:'#1852FE',fontFamily:'inherit',whiteSpace:'nowrap',textDecoration:'underline',textUnderlineOffset:3}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                ${addLabel}
              </button>
              <button onClick=${onClose} style=${{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',alignItems:'center',color:'#64748B',borderRadius:4}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
          <!-- Tabs -->
          <div style=${{position:'relative'}}>
            <div style=${{display:'flex',gap:0,overflowX:'auto'}}>
              ${entries.map((_, ti) => x`
                <button key=${ti} onClick=${()=>setActiveTab(ti)}
                  style=${{flexShrink:0,padding:'6px 20px 10px',fontSize:14,fontWeight:600,border:'none',cursor:'pointer',fontFamily:'inherit',background:'transparent',
                    color:ti===activeTab?'#1852FE':'#64748B',
                    borderBottom:ti===activeTab?'2.5px solid #1852FE':'2.5px solid transparent',
                    transition:'color .15s,border-color .15s'}}>
                  ${entryLabel} ${ti+1}
                </button>`)}
            </div>
            <div style=${{position:'absolute',bottom:0,left:0,right:0,height:'1px',background:'#E2E8F0'}}></div>
          </div>
        </div>
        <!-- Tab content -->
        <div class="scroll" style=${{flex:1,overflowY:'auto',padding:'20px 24px 24px'}}>
          <div style=${{display:'flex',alignItems:'center',gap:8,border:'1px solid #CBD5E1',borderRadius:8,padding:'8px 12px',marginBottom:4,background:'#fff'}}>
            <input value=${entry.name} onInput=${e=>setField(i,'name',e.target.value)}
              style=${{flex:1,fontSize:14,color:'#0E1A33',background:'transparent',border:'none',outline:'none',fontFamily:'inherit'}}/>
            <button onClick=${()=>setField(i,'name','')} style=${{background:'none',border:'none',cursor:'pointer',padding:0,display:'flex',color:'#94A3B8'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          ${FIELDS.map((f) => x`
            <div key=${f.key} style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px dashed #e2e8f0'}}>
              <span style=${{fontSize:13.5,color:'#94A3B8'}}>${f.label}</span>
              ${f.type==='toggle' ? x`
                <label style=${{position:'relative',display:'inline-flex',cursor:'pointer',flexShrink:0}}>
                  <input type="checkbox" checked=${entry[f.key]} onChange=${e=>setField(i,f.key,e.target.checked)} style=${{opacity:0,position:'absolute',width:0,height:0}}/>
                  <div style=${{width:44,height:24,borderRadius:12,background:entry[f.key]?'#1852FE':'#CBD5E1',transition:'background .2s',position:'relative',flexShrink:0}}>

                  style=${{fontSize:13.5,color:entry[f.key]?'#0E1A33':'#94A3B8',border:'1px solid #CBD5E1',borderRadius:8,padding:'7px 32px 7px 10px',background:'#fff',outline:'none',cursor:'pointer',fontFamily:'inherit',minWidth:160}}>
                  <option value="">Select...</option>

        <!-- Footer -->
        <div style=${{flexShrink:0,padding:'16px 24px',borderTop:'1px solid #e2e8f0',display:'flex',gap:12,background:'#fff',borderRadius:'0 0 16px 16px'}}>
          <button onClick=${onClose} style=${{flex:1,height:44,fontSize:14,fontWeight:700,border:'1.5px solid #1852FE',borderRadius:10,background:'#fff',color:'#1852FE',cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
          <button onClick=${onClose} class="gx-btn-primary" style=${{flex:2,height:44,fontSize:14,fontWeight:700}}>Save changes & re-run</button>
        </div>
      </div>
    </div>`;
}

/* ── RIGHT-adjacent: Reasoning panel (rich) — Vessel Intelligence Quick View accordion (Figma 7622:30486) ── */
function ReasoningPanelRich({ task, expanded, onDraftChange }) {
  const readOnly = task.status === 'completed';
  const sections = task.quickView || QUICK_VIEW_SECTIONS;
  const [open, setOpen] = useState(() => new Set(sections.map(s => s.key)));
  const [excludedSections, setExcludedSections] = useState(() => new Set());
  const [itemState, setItemState] = useState({});
  const [flashKey, setFlashKey] = useState(null);
  const [editModal, setEditModal] = useState(null);
  const [editCargoType, setEditCargoType] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const chipScrollRef = useRef(null);
  const [chipFade, setChipFade] = useState({ left:false, right:false });
  const [chipHover, setChipHover] = useState(false);
  const [summaryTab, setSummaryTab] = useState(() => task.summaryTabs ? task.summaryTabs[0] : null);
  const [hideOtherQuickAccess, setHideOtherQuickAccess] = useState(false);
  const otherQuickAccessTimer = useRef(null);
  useEffect(() => () => { if (otherQuickAccessTimer.current) clearTimeout(otherQuickAccessTimer.current); }, []);
  const handleOtherSummaryScroll = (e) => {
    setScrolled(e.target.scrollTop > 2);
    setHideOtherQuickAccess(true);
    if (otherQuickAccessTimer.current) clearTimeout(otherQuickAccessTimer.current);
    otherQuickAccessTimer.current = setTimeout(() => setHideOtherQuickAccess(false), 150);
  };

  useEffect(() => {
    setOpen(new Set(sections.map(s => s.key)));
    setExcludedSections(new Set());
    setItemState({});
    setFlashKey(null);
    setEditModal(null);
    setSummaryTab(task.summaryTabs ? task.summaryTabs[0] : null);
  }, [task.id]);

  const checkChipFade = () => {
    const el = chipScrollRef.current;
    if (!el) return;
    const scrollable = el.scrollWidth > el.clientWidth + 1;
    setChipFade({
      left: scrollable && el.scrollLeft > 2,
      right: scrollable && el.scrollLeft < el.scrollWidth - el.clientWidth - 2,
    });
  };
  useEffect(() => {
    checkChipFade();
    window.addEventListener('resize', checkChipFade);
    return () => window.removeEventListener('resize', checkChipFade);
  }, []);
  const seekChips = dir => {
    const el = chipScrollRef.current;
    if (el) el.scrollBy({ left: dir*160, behavior:'smooth' });
  };

  if (task.quickViewType === 'q88') return x`<${Q88Panel} task=${task}/>`;

  const operatorItems = task.operatorSummaryItems || [];
  const otherSections = task.otherSummarySections || [];
  const itemKeyOf = (sectionKey,index) => sectionKey+':'+index;
  const isItemCleared = (sectionKey,index) => !!itemState[itemKeyOf(sectionKey,index)]?.cleared;
  const flaggedCount = sections.reduce((n,s) => n + (s.items||[]).filter((it,i)=>it.error && !isItemCleared(s.key,i)).length, 0);
  const operatorFlaggedCount = operatorItems.filter((it,i)=>it.error && !isItemCleared('operatorSummary',i)).length;
  const isValidValue = v => { const t = (v||'').trim(); return !!t && t !== '--'; };

  const toggleSection = key => setOpen(prev => {
    const next = new Set(prev);
    next.has(key) ? next.delete(key) : next.add(key);
    return next;
  });
  /* NOTE for dev: editing Quick View data here (excluding a section/item, or changing a value)
     should regenerate the Actions-panel email draft and the Q88 attachment downstream, since both
     are derived from this same vessel data. That regeneration isn't wired up yet — onDraftChange()
     below is the integration point where re-generating the draft/attachment should be triggered;
     for now it only surfaces the "Email draft updated" toast so the scenario is visible to users. */
  const toggleExcludedSection = key => {
    setExcludedSections(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
    onDraftChange && onDraftChange();
  };
  const itemKey = (sectionKey,index) => sectionKey+':'+index;
  const onToggleExclude = (sectionKey,index) => {
    setItemState(prev => {
      const k = itemKey(sectionKey,index);
      const cur = prev[k] || {};
      return {...prev, [k]:{...cur, excluded:!cur.excluded}};
    });
    onDraftChange && onDraftChange();
  };
  const commitEditValue = (sectionKey,index,value,clearError) => {
    setItemState(prev => {
      const k = itemKey(sectionKey,index);
      const cur = prev[k] || {};
      return {...prev, [k]:{...cur, value, cleared: clearError ? true : cur.cleared}};
    });
    onDraftChange && onDraftChange();
  };
  const onOpenEdit = (sectionKey,index) => {
    const item = sectionKey === 'operatorSummary' ? operatorItems[index] : sections.find(s => s.key === sectionKey).items[index];
    const cur = itemState[itemKey(sectionKey,index)];
    setEditModal({ sectionKey, index, label:item.label, value: cur?.value ?? item.value, reason:'', hadError: !!item.error && !cur?.cleared });
  };
  const closeEditModal = () => setEditModal(null);
  const saveEditModal = () => {
    if (editModal.hadError && !isValidValue(editModal.value)) return;
    commitEditValue(editModal.sectionKey, editModal.index, editModal.value, editModal.hadError);
    setEditModal(null);
  };

  const scrollToSection = key => {
    const el = document.getElementById('gx-qv-section-'+key);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };

  const focusFirstError = () => {
    for (const s of sections) {
      const idx = s.items.findIndex((it,i) => it.error && !isItemCleared(s.key,i));
      if (idx === -1) continue;
      setOpen(prev => new Set(prev).add(s.key));
      const k = itemKey(s.key, idx);
      setFlashKey(k);
      setTimeout(() => {
        const el = document.getElementById('gx-ri-'+s.key+'-'+idx);
        if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }, 60);
      setTimeout(() => setFlashKey(cur => cur===k ? null : cur), 1500);
      return;
    }
  };

  const focusFirstOperatorError = () => {
    const idx = operatorItems.findIndex((it,i) => it.error && !isItemCleared('operatorSummary',i));
    if (idx === -1) return;
    const k = itemKey('operatorSummary', idx);
    setFlashKey(k);
    setTimeout(() => {
      const el = document.getElementById('gx-ri-operatorSummary-'+idx);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 60);
    setTimeout(() => setFlashKey(cur => cur===k ? null : cur), 1500);
  };

  return x`
    <div style=${{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
      <div class=${'gx-hdr-edge'+(task.hideQuickAccess && scrolled?' gx-hdr-edge--shadow':'')} style=${{flexShrink:0,background:'#fff',padding:'11px 18px',display:'flex',alignItems:'center',gap:8}}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5a6b85" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span style=${{fontSize:11,fontWeight:700,color:'#0E1A33',letterSpacing:'.07em',textTransform:'uppercase',flex:1}}>Reasoning</span>
        ${readOnly ? x`
          <span style=${{display:'inline-flex',alignItems:'center',gap:4,background:'#f0fdf4',color:'#16a34a',border:'1px solid #bbf7d0',borderRadius:99,padding:'2px 9px',fontSize:10,fontWeight:700}}>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Completed
          </span>` : task.noDataFound ? x`
          <span style=${{display:'inline-flex',alignItems:'center',gap:4,background:'#F1F5F9',color:'#475569',borderRadius:99,padding:'2px 9px',fontSize:10,fontWeight:700}}>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            No data available
          </span>` : flaggedCount > 0 ? x`
          <span style=${{display:'inline-flex',alignItems:'center',gap:4,background:'#FEE2E2',color:'#991B1B',borderRadius:99,padding:'2px 9px',fontSize:10,fontWeight:700}}>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Action Required
          </span>` : x`
          <span style=${{display:'inline-flex',alignItems:'center',gap:4,background:'#FEF3C7',color:'#92400E',borderRadius:99,padding:'2px 9px',fontSize:10,fontWeight:700}}>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Awaiting
          </span>`}
      </div>
      ${task.summaryTabs ? x`
      <div style=${{flexShrink:0,display:'flex',gap:8,alignItems:'center',padding:'0 16px 12px',borderBottom:'1px solid #f1f5f9'}}>
        ${task.summaryTabs.map(t => x`
          <button key=${t} onClick=${()=>setSummaryTab(t)} class=${'gx-qv-chip'+(summaryTab===t?' gx-qv-chip--active':'')} style=${{flexShrink:0,display:'inline-flex',alignItems:'center',gap:4}}>
            ${t==='Operator Summary' && operatorFlaggedCount>0 ? x`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#DC2625" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>` : null}
            ${t}
          </button>`)}
      </div>` : null}
      ${(!task.summaryTabs || summaryTab==='Master Summary') ? x`
      <${Fragment}>
      ${!task.noDataFound && !task.hideQuickAccess ? x`
      <div class=${'gx-chip-scroll-wrap gx-hdr-edge'+(scrolled?' gx-hdr-edge--shadow':'')} onMouseEnter=${()=>setChipHover(true)} onMouseLeave=${()=>setChipHover(false)}
        style=${task.summaryTabs
          ? {flexShrink:0,position:'relative',paddingTop:12,paddingBottom:12}
          : {flexShrink:0,position:'relative',paddingBottom:12,borderBottom:'1px solid #f1f5f9'}}>
        <div ref=${chipScrollRef} onScroll=${checkChipFade} class="scroll" style=${{display:'flex',gap:8,flexWrap:'nowrap',overflowX:'auto',overflowY:'hidden',padding:'0 16px'}}>
          ${sections.map(s => x`
            <button key=${s.key} class="gx-qv-chip" style=${{flexShrink:0}} onClick=${()=>{ if(!open.has(s.key)) toggleSection(s.key); scrollToSection(s.key); }}>${s.label}</button>`)}
        </div>
        ${chipFade.left ? x`
          <button class=${'gx-chip-seek gx-chip-seek--left'+(chipHover?' gx-chip-seek--visible':'')} onClick=${()=>seekChips(-1)} aria-label="Scroll left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>` : null}
        ${chipFade.right ? x`
          <button class=${'gx-chip-seek gx-chip-seek--right'+(chipHover?' gx-chip-seek--visible':'')} onClick=${()=>seekChips(1)} aria-label="Scroll right">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>` : null}

/* ── Toast: top-center, 48px from top (Figma 7808:391375) ──
   Slides down to appear / back up to disappear (600ms each), holds 3s, click to dismiss early. */
const GX_TOAST_ENTER_MS = 600;
const GX_TOAST_HOLD_MS  = 3000;
const GX_TOAST_EXIT_MS  = 600;
function Toast({ title, message, onDone }) {
  const [visible, setVisible] = useState(false);
  const holdTimer = useRef(null);
  const exitTimer = useRef(null);

  useEffect(() => {
    const enterTimer = setTimeout(() => setVisible(true), 20);
    holdTimer.current = setTimeout(dismiss, GX_TOAST_ENTER_MS + GX_TOAST_HOLD_MS);
    return () => {
      clearTimeout(enterTimer);
      clearTimeout(holdTimer.current);
      clearTimeout(exitTimer.current);
    };
  }, []);

  const dismiss = () => {
    setVisible(false);
    clearTimeout(holdTimer.current);
    exitTimer.current = setTimeout(onDone, GX_TOAST_EXIT_MS);
  };

  return x`
    <div onClick=${dismiss} title="Click to dismiss" style=${{position:'fixed',top:48,left:'50%',
        transform:visible?'translate(-50%,0)':'translate(-50%,-140%)',
        transition:`transform ${visible?GX_TOAST_ENTER_MS:GX_TOAST_EXIT_MS}ms cubic-bezier(.22,1,.36,1)`,
        zIndex:3000,display:'flex',gap:16,alignItems:'center',padding:16,width:400,
        background:'#E9F9EF',border:'0.5px solid #A7E8BF',borderRadius:8,boxShadow:'0 2px 8px rgba(0,0,0,0.2)',cursor:'pointer'}}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style=${{flexShrink:0}}><circle cx="12" cy="12" r="10" fill="#16A34A"/><path d="M8 12.5l2.5 2.5 5-5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style=${{display:'flex',flexDirection:'column',gap:4}}>
        <div style=${{fontSize:14,lineHeight:'20px',fontWeight:700,color:'#147638'}}>${title}</div>
        <div style=${{fontSize:14,lineHeight:'20px',fontWeight:400,color:'#147638'}}>${message}</div>
      </div>
    </div>`;
}

  const [tooNarrow,   setTooNarrow]   = useState(window.innerWidth < 1133);
  const [isCompactMode, setIsCompactMode] = useState(window.innerWidth < 1280);
  const [manualPanelWidth, setManualPanelWidth] = useState(null);
  const panelsRowRef = useRef(null);
  const inputPanelRef = useRef(null);
  const reasoningPanelRef = useRef(null);
  const actionsPanelRef = useRef(null);
  const baseExpandedWidthRef = useRef(null);
  const [narrowPanels, setNarrowPanels] = useState({});
  useEffect(() => {
    const refs = { input:inputPanelRef, reasoning:reasoningPanelRef, actions:actionsPanelRef };
    const recalc = () => {
      const rowW = panelsRowRef.current?.getBoundingClientRect().width || 0;
      if (!rowW) return;
      setNarrowPanels(prev => {
        const next = {};
        let changed = false;
        Object.keys(refs).forEach(key => {
          if (isCompactMode) {
            next[key] = key !== activePanel;
          } else {
            const w = refs[key].current?.getBoundingClientRect().width || 0;
            next[key] = w > 0 && w < 350;
          }
          if (next[key] !== prev[key]) changed = true;
        });
        return changed ? next : prev;
      });
    };
    recalc();
    const ro = new ResizeObserver(recalc);
    if (panelsRowRef.current) ro.observe(panelsRowRef.current);
    Object.values(refs).forEach(r => { if (r.current) ro.observe(r.current); });
    return () => ro.disconnect();
  }, [selId, activePanel, manualPanelWidth, newTaskMode, isCompactMode]);
  useEffect(() => {
    baseExpandedWidthRef.current = null;
    if (isCompactMode) {
      const rowW = panelsRowRef.current?.getBoundingClientRect().width || window.innerWidth;
      setManualPanelWidth(Math.round(rowW * 0.75));
    } else {
      setManualPanelWidth(null);
    }
  }, [activePanel, isCompactMode]);
  const startPanelResize = (e, panelRef, side) => {
    e.stopPropagation();
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = panelRef.current.getBoundingClientRect().width;
    const rowWidth = panelsRowRef.current.getBoundingClientRect().width;
    const OTHER_MIN = 240;
    let PANEL_MIN, maxWidth;
    if (isCompactMode) {
      // Compact mode: focused panel defaults to its max (75%); handle only shrinks it down from there.
      PANEL_MIN = Math.min(320, rowWidth - OTHER_MIN);
      maxWidth = rowWidth * 0.75;
    } else {
      // First drag after selecting this panel: no manual override yet, so the panel's
      // current (ratio-based) width IS its default expanded width — cache it as the floor
      // for every subsequent drag, so the user can never shrink below "expanded" size.
      if (baseExpandedWidthRef.current == null) baseExpandedWidthRef.current = startWidth;
      PANEL_MIN = baseExpandedWidthRef.current;
      maxWidth = Math.min(window.innerWidth * 0.8, rowWidth - OTHER_MIN * 2 - 32);
    }
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const onMove = ev => {
      const delta = ev.clientX - startX;
      let w = startWidth + (side === 'left' ? delta : -delta);
      w = Math.max(PANEL_MIN, Math.min(maxWidth, w));
      setManualPanelWidth(w);
    };
    const onUp = () => {
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  useEffect(() => {
    const handler = () => { setTooNarrow(window.innerWidth < 1133); setIsCompactMode(window.innerWidth < 1280); };
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const notifyDraftUpdated = (title, message) => {
    setToastKey(k => k + 1);
    setToast({
    title: title || 'Email draft updated',
    message: message || 'Drafted email is updated based on the changes in data.',
    });
  };

  const filtered = TASKS.filter(t => {
    if (vessel !== 'all' && t.vessel !== vessel) return false;
    if (agentFilter !== 'all' && t.agent !== agentFilter) return false;
    if (status !== 'all' && t.status !== status) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!t.agent.toLowerCase().includes(q) &&
          !t.task.toLowerCase().includes(q) &&
          !t.vesselName.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const task = filtered.find(t => t.id === selId) || filtered[0] || null;

  useEffect(() => {
    if (!task) return;
    setActivePanel(taskHasReasoningError(task) ? 'reasoning' : 'actions');
  }, [task && task.id]);

  if (tooNarrow) return x`<${UnsupportedScreen}/>`;

  const handleVessel = v => {
    setVessel(v);
    const f = TASKS.filter(t => v === 'all' || t.vessel === v);
    if (f.length) setSelId(f[0].id);
  };
  const handleStatus = s => {
    setStatus(s);
    const f = TASKS.filter(t => s === 'all' || t.status === s);
    if (f.length) setSelId(f[0].id);
  };
  const handleNewTask = () => {
    setNewTask({ agent:'', vessel:'', objective:'', voyageRef:'', priority:'medium', file:null });
    setNewTaskMode(true);
  };
  const handleAssign = () => {
    // Reset new task mode; in a real app this would POST the task
    setNewTaskMode(false);
    setNewTask({ agent:'', vessel:'', objective:'', voyageRef:'', priority:'medium', file:null });
  };

  const reasoningIcon = x`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c8d4e0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>`;
  const actionsIcon  = x`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c8d4e0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;

  const anyNarrow = narrowPanels.input || narrowPanels.reasoning || narrowPanels.actions;

  const railInputIcon = x`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
  const railReasoningIcon = x`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>`;
  const railActionsIcon = x`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;

  const panelBoxStyle = (key) => {
    const isActive = activePanel === key;
    if (narrowPanels[key]) {
      return {flex:'0 0 44px',display:'flex',flexDirection:'column',minWidth:0,background:'transparent',borderRadius:0,border:'none',overflow:'visible',boxShadow:'none',cursor:'pointer'};
    }
    return {flex:isActive?(manualPanelWidth!=null?`0 0 ${manualPanelWidth}px`:'0 0 45%'):'1 1 0',transition:manualPanelWidth!=null?'border 150ms':'flex 220ms ease',display:'flex',flexDirection:'column',minWidth:0,background:'#fff',borderRadius:10,border:isActive?'1.5px solid #1852FE':'1px solid #e4e9f2',overflow:'hidden',boxShadow:isActive?'0 2px 12px rgba(24,82,254,0.10)':'0 1px 4px rgba(0,0,0,0.05)',cursor:isActive?'default':'pointer'};
  };

  return x`
    <div style=${{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',background:'#F7FAFC'}}>
      ${toast ? x`<${Toast} key=${toastKey} title=${toast.title} message=${toast.message} onDone=${()=>setToast(null)}/>` : null}
      <${VesselBar} filter=${vessel} onChange=${handleVessel} agentFilter=${agentFilter} setAgentFilter=${setAgentFilter} statusFilter=${status} setStatusFilter=${handleStatus} search=${search} setSearch=${setSearch} total=${filtered.length} onNewTask=${handleNewTask}/>
      ${newTaskMode
        ? x`<${NewTaskHeader} newTask=${newTask} setNewTask=${setNewTask} onCancel=${()=>setNewTaskMode(false)}/>`
        : x`<${AgentCarousel} tasks=${filtered} selectedId=${task ? task.id : -1} onSelect=${setSelId} statusFilter=${status}/>`}
      <div ref=${panelsRowRef} style=${{flex:1,display:'flex',overflow:'hidden',minHeight:0,padding:'10px 12px',gap:10,background:'#F0F1F5'}}>
        ${newTaskMode ? x`
          <div style=${{flex:'0 0 27%',display:'flex',flexDirection:'column',minWidth:0,background:'#fff',borderRadius:10,border:'1px solid #e4e9f2',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,0.05)'}}>
            <${NewTaskInputForm} newTask=${newTask} setNewTask=${setNewTask} onAssign=${handleAssign}/>
          </div>
          <div style=${{flex:'0 0 46%',display:'flex',flexDirection:'column',minWidth:0,background:'#fff',borderRadius:10,border:'1px dashed #dde4f0',overflow:'hidden',opacity:0.7}}>
            <${InactivePanel} icon=${reasoningIcon} title="Reasoning" subtitle="Reasoning will begin once the task is assigned to an agent"/>
          </div>
          <div style=${{flex:'0 0 calc(27% - 10px)',display:'flex',flexDirection:'column',minWidth:0,background:'#fff',borderRadius:10,border:'1px dashed #dde4f0',overflow:'hidden',opacity:0.7}}>
            <${InactivePanel} icon=${actionsIcon} title="Actions" subtitle="Actions will appear after the agent reasons through the task"/>
          </div>
        ` : task ? (anyNarrow ? (() => {
          const railDefs = [
            {key:'actions', title:'Output', icon:railActionsIcon},
            {key:'reasoning', title:'Reasoning', icon:railReasoningIcon},
            {key:'input', title:'Input', icon:railInputIcon},
          ];
          const activeIdx = railDefs.findIndex(r => r.key === activePanel);
          const BORDER = '#e2e8f0';
          return x`
          <div style=${{flex:1,display:'flex',overflow:'hidden'}}>
            <div style=${{width:44,flexShrink:0,display:'grid',gridTemplateRows:'repeat(3, minmax(0, 1fr))',gap:4}}>
              ${railDefs.map(r => r.key===activePanel
                ? x`<div key=${r.key} style=${{flex:1}}/>`
                : x`<${PanelCollapsedLabel} key=${r.key} active=${false} icon=${r.icon} title=${r.title} onClick=${()=>setActivePanel(r.key)}/>`)}
            </div>
            <div style=${{flex:1,minWidth:0,position:'relative'}}>
              <div style=${{boxSizing:'border-box',position:'absolute',left:-44,top:`${activeIdx*(100/3)}%`,height:`${100/3}%`,width:44,background:'#fff',borderTop:`1px solid ${BORDER}`,borderLeft:`1px solid ${BORDER}`,borderBottom:`1px solid ${BORDER}`,borderRight:'none',borderRadius:'10px 0 0 10px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,color:'#1852FE',zIndex:2}}>
                <span style=${{writingMode:'vertical-rl',transform:'rotate(180deg)',fontSize:14,fontWeight:600,whiteSpace:'nowrap'}}>${railDefs[activeIdx].title}</span>
                <div style=${{display:'flex',alignItems:'center',justifyContent:'center',transform:'rotate(-90deg)'}}>${railDefs[activeIdx].icon}</div>
              </div>
              <div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',background:'#fff',borderRadius:'0 12px 12px 0',border:`1px solid ${BORDER}`,overflow:'hidden'}}>
                ${activePanel==='input' ? x`<${InputPanel} task=${task}/>` : activePanel==='reasoning' ? x`<${ReasoningPanel} task=${task} expanded=${true} onDraftChange=${notifyDraftUpdated}/>` : x`<${ActionsPanel} task=${task} expanded=${true}/>`}
              </div>
            </div>
          </div>`;
        })() : x`
          <div ref=${inputPanelRef} onClick=${()=>setActivePanel('input')}
            class=${activePanel!=='input'?'gx-panel-inactive':''}
            style=${panelBoxStyle('input')}>
            <${InputPanel} task=${task}/>
          </div>
          ${activePanel==='input' ? x`<${ResizeHandle} onDrag=${e=>startPanelResize(e,inputPanelRef,'left')}/>` : null}
          <div ref=${reasoningPanelRef} onClick=${()=>setActivePanel('reasoning')}
            class=${activePanel!=='reasoning'?'gx-panel-inactive':''}
            style=${panelBoxStyle('reasoning')}>
            <${ReasoningPanel} task=${task} expanded=${activePanel==='reasoning'} onDraftChange=${notifyDraftUpdated}/>
          </div>
          ${activePanel!=='input' ? x`<${ResizeHandle} onDrag=${e=>startPanelResize(e, activePanel==='reasoning'?reasoningPanelRef:actionsPanelRef, activePanel==='reasoning'?'left':'right')}/>` : null}
          <div ref=${actionsPanelRef} onClick=${()=>setActivePanel('actions')}
            class=${activePanel!=='actions'?'gx-panel-inactive':''}
            style=${panelBoxStyle('actions')}>
            <${ActionsPanel} task=${task} expanded=${activePanel==='actions'}/>
          </div>
        `) : x`
          <div style=${{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'#94a3b8'}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span style=${{fontSize:13}}>No agents match the current filter</span>
          </div>`}
      </div>
    </div>`;
}

createRoot(document.getElementById('root')).render(x`<${App}/>`);
</script>
